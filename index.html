<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAI Quests</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #7257fa;
            --accent-hover: #5d42e2;
            --text-color: #e2e2e8;
            --text-dim: #a0a0b0;
            --border-color: #2e2e38;
            --user-msg-bg: #2a2a36;
            --ai-msg-bg: #181820;
            --card-bg: #252530;
            --input-bg: #282832;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f8;
            --panel-bg: #ffffff;
            --accent-color: #6246ea;
            --accent-hover: #4c35c3;
            --text-color: #2b2c34;
            --text-dim: #6c757d;
            --border-color: #dcdce6;
            --user-msg-bg: #e8e6f8;
            --ai-msg-bg: #ffffff;
            --card-bg: #f8f9fa;
            --input-bg: #f0f0f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--panel-bg);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--panel-bg);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
            transition: background 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            display: flex;
            position: relative;
        }

        /* Sidebar */
        #sidebar {
            width: 380px;
            height: 100%;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease, transform 0.3s ease;
            z-index: 100;
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            margin-left: -380px;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Main Chat Area */
        #main-chat {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            min-width: 0;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            height: 60px;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .chat-header h2 {
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-round {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            padding: 0;
            cursor: pointer;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-round:hover {
            border-color: var(--accent-color);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        /* Generation Status & Spinner Bar */
        #statusContainer {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--accent-color);
            font-weight: 500;
        }

        #statusContainer.active {
            display: flex;
        }

        .pulse-loader {
            display: flex;
            gap: 6px;
        }

        .pulse-loader span {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .pulse-loader span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .pulse-loader span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }

            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: 12px 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-controls {
            display: flex;
            gap: 10px;
        }

        /* Action Buttons & Options Container */
        .ai-action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .ai-action-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-weight: normal;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 16px;
        }

        .ai-action-btn:hover {
            border-color: var(--accent-color);
            background: var(--panel-bg);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
        }

        .option-pill {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .option-pill:hover {
            border-color: var(--accent-color);
            transform: translateX(3px);
        }

        /* Mobile Overlay */
        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 90;
        }

        /* Form Inputs */
        input,
        select,
        textarea,
        button {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            background: var(--accent-color);
            cursor: pointer;
            border: none;
            font-weight: bold;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.danger {
            background: #d93838;
        }

        button.danger:hover {
            background: #b82525;
        }

        .btn-toggle-sidebar {
            padding: 6px 12px;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        /* Collapsible Character Cards */
        details.char-details {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            background: var(--panel-bg);
        }

        details.char-details summary {
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            list-style: none;
        }

        details.char-details summary::-webkit-details-marker {
            display: none;
        }

        .char-details-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        /* Message Styling */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 90%;
            line-height: 1.5;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 17px;
            position: relative;
        }

        .message.user {
            background: var(--user-msg-bg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .message.narration {
            background: var(--ai-msg-bg);
            border-left: 3px solid var(--accent-color);
            align-self: flex-start;
            width: 100%;
            font-style: italic;
            color: var(--text-color);
        }

        .message.character {
            background: var(--ai-msg-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .char-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .user-header {
            justify-content: flex-end;
        }

        .char-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
            border: 2px solid var(--accent-color);
        }

        .char-name {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 15px;
        }

        .message.user .char-name {
            color: var(--text-color);
        }

        /* Relationship Badges (0-100%) */
        .rel-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            line-height: 1.2;
            vertical-align: middle;
            user-select: none;
        }

        .rel-badge.rel-love {
            color: #ff6b9d;
            border-color: rgba(255, 107, 157, 0.35);
            background: rgba(255, 107, 157, 0.12);
        }

        .rel-badge.rel-friend {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.35);
            background: rgba(74, 222, 128, 0.12);
        }

        .rel-badge.rel-friendly {
            color: #2dd4bf;
            border-color: rgba(45, 212, 191, 0.35);
            background: rgba(45, 212, 191, 0.12);
        }

        .rel-badge.rel-neutral {
            color: #94a3b8;
            border-color: rgba(148, 163, 184, 0.35);
            background: rgba(148, 163, 184, 0.12);
        }

        .rel-badge.rel-suspicious {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.35);
            background: rgba(251, 191, 36, 0.12);
        }

        .rel-badge.rel-hostile {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.35);
            background: rgba(248, 113, 113, 0.12);
        }

        .rel-badge.rel-hate {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.2);
            font-weight: bold;
        }

        .char-text {
            white-space: pre-wrap;
        }

        .btn-edit-msg {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 2px 5px;
        }

        .btn-edit-msg:hover {
            opacity: 1;
        }

        .btn-send {
            width: 44px !important;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            align-self: flex-end;
        }

        .btn-send svg {
            margin-left: 3px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row>select {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                width: 85%;
                max-width: 340px;
                transform: translateX(-100%);
                margin-left: 0 !important;
                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #sidebar-overlay.active {
                display: block;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="row" style="justify-content: space-between;">
                <strong>Gemini Quest</strong>
                <button class="btn-round" onclick="toggleTheme()" id="themeToggleBtn"
                    title="Переключити тему">☀️</button>
            </div>

            <div class="form-group">
                <label>Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="Введи свій API Key..." oninput="saveApiKey(this.value)">
            </div>

            <div class="form-group">
                <label>Модель Gemini</label>
                <select id="modelSelect" onchange="saveSelectedModel(this.value)">
                    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                    <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                </select>
            </div>

            <div class="row">
                <select id="gameSelect" onchange="loadSelectedGame()"></select>
                <button onclick="createNewGame()" title="Створити гру">+</button>
                <button onclick="exportCurrentGame()" title="Експорт у JSON">📤</button>
                <button onclick="document.getElementById('importFileInput').click()" title="Імпорт з JSON">📥</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importGame(this)">
                <button class="danger" onclick="deleteCurrentGame()" title="Видалити гру">🗑</button>
            </div>
        </div>

        <div class="sidebar-content" id="gameStatePanel" style="display: none;">
            <!-- World Settings -->
            <div class="card">
                <div class="card-header">🌍 Оточення та Світ</div>
                <div class="form-group">
                    <label>Локація</label>
                    <textarea rows="2" id="stateLocation" onchange="updateGameState()"></textarea>
                </div>
                <div class="form-group">
                    <label>Час доби</label>
                    <select id="stateTimeOfDay" onchange="updateGameState(); syncTimeOfDayButton();">
                        <option value="Ранок">🌅 Ранок</option>
                        <option value="День">☀️ День</option>
                        <option value="Вечір">🌆 Вечір</option>
                        <option value="Ніч">🌙 Ніч</option>
                    </select>
                </div>
            </div>

            <!-- Objectives -->
            <div class="card">
                <div class="card-header">🎯 Цілі квесту</div>
                <textarea id="stateObjectives" rows="4" onchange="updateGameState()"></textarea>
            </div>

            <!-- Memory Log -->
            <div class="card">
                <div class="card-header">🧠 Пам'ять квесту</div>
                <textarea id="stateMemory" rows="4" placeholder="Основні моменти..."
                    onchange="updateGameState()"></textarea>
            </div>

            <!-- Character Selection -->
            <div class="card">
                <div class="card-header">🎭 Ваш гравець</div>
                <select id="playerCharSelect" onchange="updateGameState()"></select>
            </div>

            <!-- Characters Manager -->
            <div class="card">
                <div class="card-header">
                    👥 Персонажі
                    <button style="padding: 2px 8px;" onclick="addNewCharacter()">+</button>
                </div>
                <div id="charactersList" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div id="main-chat">
        <div class="chat-header">
            <div class="chat-header-title">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Меню">☰</button>
                <h2 id="currentGameTitle">Оберіть або створіть гру</h2>
            </div>
            <div class="header-actions">
                <button class="btn-round" id="headerTimeBtn" onclick="cycleTimeOfDay()"
                    title="Змінити час доби">☀️</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <!-- GENERATION SPINNER (Relocated above input) -->
        <div id="statusContainer">
            <div class="pulse-loader">
                <span></span><span></span><span></span>
            </div>
            <span id="statusText">Gemini створює відповідь...</span>
        </div>

        <div class="chat-input-area">
            <div class="input-controls">
                <textarea id="userInput" rows="1" style="flex: 1; resize: none; overflow-y: auto;"
                    placeholder="Що ти робиш або кажеш?..." disabled></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="Надіслати" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================
           0. PRESETS & INITIALIZATION
           ========================================== */
        const SCENARIOS_PRESETS = [
            {
                title: "Таємниця закинутої таверни",
                location: "Запорошена таверна «Чорний Круг»",
                timeOfDay: "Ніч",
                objectives: "Знайти зашифровану карту до старої шахти",
                memory: "Ви сховалися у закинутій будівлі під час грози.",
                pName: "Сергій", pSurname: "Мандрівник", pRace: "Людина", pGender: "Чоловіча", pAge: 29, pRole: "Шукач пригод", pPersonality: "Сміливий, допитливий", pApp: "Темний плащ, шпага на поясі", pSeed: "Serhii",
                cName: "Емілі", cSurname: "Золота Лисиця", cRace: "Людина", cGender: "Жіноча", cAge: 24, cRole: "Здібна злодійка", cPersonality: "Горда егоїстка, допитлива, кмітлива, імпульсивна та закохана у стародавні таємниці, гостра на язик", cApp: "Шкіряний обладунок, короткий клинок", cSeed: "Emily"
            }
        ];

        const TIME_STEPS = ["Ранок", "День", "Вечір", "Ніч"];
        const TIME_ICONS = { "Ранок": "🌅", "День": "☀️", "Вечір": "🌆", "Ніч": "🌙" };

        let db = null;
        let currentGame = null;
        let isGenerating = false;
        let currentOptions = [];

        /* ==========================================
           1. RELATIONSHIPS ENGINE (0-100%)
           ========================================== */
        function getRelation(char, targetId) {
            if (!char) return 50;
            if (!char.relations || typeof char.relations !== 'object') char.relations = {};
            if (char.relations[targetId] === undefined) char.relations[targetId] = 50;
            return char.relations[targetId];
        }

        function setRelation(char, targetId, val) {
            if (!char) return;
            if (!char.relations || typeof char.relations !== 'object') char.relations = {};
            const num = Math.max(0, Math.min(100, parseInt(val) || 0));
            char.relations[targetId] = num;
        }

        function getRelClass(rel) {
            if (rel >= 85) return 'rel-love';
            if (rel >= 70) return 'rel-friend';
            if (rel >= 55) return 'rel-friendly';
            if (rel >= 45) return 'rel-neutral';
            if (rel >= 30) return 'rel-suspicious';
            if (rel >= 15) return 'rel-hostile';
            return 'rel-hate';
        }

        function getRelIcon(rel) {
            if (rel >= 85) return '💖';
            if (rel >= 70) return '💚';
            if (rel >= 55) return '😊';
            if (rel >= 45) return '😐';
            if (rel >= 30) return '🤨';
            if (rel >= 15) return '😠';
            return '💀';
        }

        function getRelDescription(rel) {
            if (rel >= 85) return 'Закоханість / Абсолютна відданість';
            if (rel >= 70) return 'Щира дружба / Довіра';
            if (rel >= 55) return 'Симпатія / Прихильність';
            if (rel >= 45) return 'Нейтральне / Ділове';
            if (rel >= 30) return 'Стриманість / Підозра';
            if (rel >= 15) return 'Неприязнь / Ворожість';
            return 'Ненависть / Смертельний ворог';
        }

        function updateCharRelation(charId, targetId, val) {
            const c = currentGame.characters.find(char => char.id === charId);
            if (c) {
                setRelation(c, targetId, val);
                dbSaveGame(currentGame);
                renderMessages();
            }
        }

        function updateRelBadgeUI(charId, val) {
            const num = parseInt(val) || 0;
            const badge = document.getElementById(`rel_badge_${charId}`);
            if (badge) {
                badge.className = `rel-badge ${getRelClass(num)}`;
                badge.innerText = `${getRelIcon(num)} ${num}%`;
            }
        }

        function updateOtherRelBadgeUI(charId, targetId, val) {
            const num = parseInt(val) || 0;
            const badge = document.getElementById(`rel_badge_${charId}_${targetId}`);
            if (badge) {
                badge.className = `rel-badge ${getRelClass(num)}`;
                badge.innerText = `${getRelIcon(num)} ${num}%`;
            }
        }

        /* ==========================================
           2. THEME & UI HELPERS
           ========================================== */
        function initTheme() {
            const saved = localStorage.getItem('app_theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
            updateThemeButtonText();
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('app_theme', next);
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const current = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerText = current === 'light' ? '🌙' : '☀️';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        function cycleTimeOfDay() {
            if (!currentGame) return;
            const currentIdx = TIME_STEPS.indexOf(currentGame.timeOfDay || "День");
            const nextIdx = (currentIdx + 1) % TIME_STEPS.length;
            currentGame.timeOfDay = TIME_STEPS[nextIdx];
            document.getElementById('stateTimeOfDay').value = currentGame.timeOfDay;
            syncTimeOfDayButton();
            dbSaveGame(currentGame);
        }

        function syncTimeOfDayButton() {
            const tod = currentGame ? currentGame.timeOfDay : "День";
            document.getElementById('headerTimeBtn').innerText = TIME_ICONS[tod] || "☀️";
        }

        function setStatus(loading, text = "Gemini генерує відповідь...") {
            isGenerating = loading;
            const container = document.getElementById('statusContainer');
            const statusText = document.getElementById('statusText');
            if (loading) {
                statusText.innerText = text;
                container.classList.add('active');
            } else {
                container.classList.remove('active');
            }
        }

        /* Auto Textarea Height & Enter key submit */
        const userInput = document.getElementById('userInput');
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        });
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        /* ==========================================
           3. STORAGE & DATABASE (IndexedDB)
           ========================================== */
        const DB_NAME = 'GeminiQuestDB';
        const DB_VERSION = 1;

        function saveApiKey(key) { localStorage.setItem('gemini_api_key', key); }
        function loadApiKey() {
            const saved = localStorage.getItem('gemini_api_key');
            if (saved) document.getElementById('apiKey').value = saved;
        }

        function saveSelectedModel(model) { localStorage.setItem('gemini_selected_model', model); }
        function loadSelectedModel() {
            const saved = localStorage.getItem('gemini_selected_model') || 'gemini-3.7-flash';
            document.getElementById('modelSelect').value = saved;
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('games')) {
                        db.createObjectStore('games', { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAllGames() {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readonly');
                const store = tx.objectStore('games');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
            });
        }

        function dbSaveGame(game) {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readwrite');
                const store = tx.objectStore('games');
                const req = store.put(game);
                req.onsuccess = () => resolve(req.result);
            });
        }

        function dbDeleteGame(id) {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readwrite');
                const store = tx.objectStore('games');
                const req = store.delete(id);
                req.onsuccess = () => resolve();
            });
        }

        /* ==========================================
           4. IMPORT / EXPORT JSON
           ========================================== */
        function exportCurrentGame() {
            if (!currentGame) return alert("Немає активної гри для експорту!");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentGame, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${currentGame.title || 'game'}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importGame(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedGame = JSON.parse(e.target.result);
                    delete importedGame.id; // Assign new ID
                    const id = await dbSaveGame(importedGame);
                    currentGame = { ...importedGame, id };
                    await refreshGameList();
                    renderAll();
                    await checkAndAutoRespond();
                    alert("Гру успішно імпортовано!");
                } catch (err) {
                    alert("Помилка читання JSON файлу: " + err.message);
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        /* ==========================================
           5. GAME STATE ENGINE
           ========================================== */
        async function refreshGameList() {
            const games = await dbGetAllGames();
            const select = document.getElementById('gameSelect');
            select.innerHTML = '';

            if (games.length === 0) {
                select.innerHTML = '<option value="">Немає збережених ігор</option>';
                document.getElementById('gameStatePanel').style.display = 'none';
                document.getElementById('currentGameTitle').innerText = 'Створіть нову гру';
                currentGame = null;
                renderMessages();
                return;
            }

            games.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.title;
                select.appendChild(opt);
            });

            if (!currentGame && games.length > 0) {
                select.value = games[0].id;
                await loadSelectedGame();
            } else if (currentGame) {
                select.value = currentGame.id;
            }
        }

        async function createNewGame() {
            const defaultPreset = SCENARIOS_PRESETS[0];
            const title = prompt("Введіть назву нової пригоди:", defaultPreset.title);
            if (!title) return;

            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;

            let gameData = null;

            if (apiKey) {
                setStatus(true, "Створення світу та персонажів...");
                try {
                    const promptGen = `Створи початковий світ та 2 головних персонажів для квесту: "${title}". Поверни JSON з полями:
                    {
                      "location": "опис локації", "timeOfDay": "Ранок або День або Вечір або Ніч", "objectives": "цілі", "memory": "пам'ять",
                      "maleCharacter": { "name": "", "surname": "", "race": "Людина / Ельф / інша", "age": 25, "role": "", "personality": "", "appearance": "", "seed": "m1" },
                      "femaleCharacter": { "name": "", "surname": "", "race": "Людина / Ельф / інша", "age": 24, "role": "", "personality": "", "appearance": "", "seed": "f1" }
                    }`;

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: promptGen }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        gameData = JSON.parse(data.candidates[0].content.parts[0].text);
                    }
                } catch (err) {
                    console.error("AI error, using fallback preset", err);
                } finally {
                    setStatus(false);
                }
            }

            if (!gameData) {
                gameData = {
                    location: defaultPreset.location,
                    timeOfDay: defaultPreset.timeOfDay,
                    objectives: defaultPreset.objectives,
                    memory: defaultPreset.memory,
                    maleCharacter: { name: defaultPreset.pName, surname: defaultPreset.pSurname, race: defaultPreset.pRace, age: defaultPreset.pAge, role: defaultPreset.pRole, personality: defaultPreset.pPersonality, appearance: defaultPreset.pApp, seed: defaultPreset.pSeed },
                    femaleCharacter: { name: defaultPreset.cName, surname: defaultPreset.cSurname, race: defaultPreset.cRace, age: defaultPreset.cAge, role: defaultPreset.cRole, personality: defaultPreset.cPersonality, appearance: defaultPreset.cApp, seed: defaultPreset.cSeed }
                };
            }

            const pId = "player_" + Date.now();
            const cId = "char_" + (Date.now() + 1);

            const newGame = {
                title: title,
                location: gameData.location,
                timeOfDay: gameData.timeOfDay,
                objectives: gameData.objectives,
                memory: gameData.memory,
                playerCharId: pId,
                isStarted: false,
                characters: [
                    {
                        id: pId, name: gameData.maleCharacter.name, surname: gameData.maleCharacter.surname, race: gameData.maleCharacter.race || "Людина", gender: "Чоловіча", age: gameData.maleCharacter.age, role: gameData.maleCharacter.role, personality: gameData.maleCharacter.personality, appearance: gameData.maleCharacter.appearance, avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${gameData.maleCharacter.seed}`, relations: {}
                    },
                    {
                        id: cId, name: gameData.femaleCharacter.name, surname: gameData.femaleCharacter.surname, race: gameData.femaleCharacter.race || "Людина", gender: "Жіноча", age: gameData.femaleCharacter.age, role: gameData.femaleCharacter.role, personality: gameData.femaleCharacter.personality, appearance: gameData.femaleCharacter.appearance, avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${gameData.femaleCharacter.seed}`, relations: { [pId]: 45 }
                    }
                ],
                messages: [
                    { type: "narration", text: `Світ створено. Персонажі: ${gameData.maleCharacter.name} (${gameData.maleCharacter.race || 'Людина'}) та ${gameData.femaleCharacter.name} (${gameData.femaleCharacter.race || 'Людина'}). Натисніть «Почати гру».` }
                ]
            };

            const id = await dbSaveGame(newGame);
            currentGame = { ...newGame, id };
            await refreshGameList();
            renderAll();
        }

        async function loadSelectedGame() {
            const id = parseInt(document.getElementById('gameSelect').value);
            if (!id) return;
            const games = await dbGetAllGames();
            currentGame = games.find(g => g.id === id);
            renderAll();
            await checkAndAutoRespond();
        }

        /* Check if last message is from user and trigger auto-response on load */
        async function checkAndAutoRespond() {
            if (!currentGame || !currentGame.isStarted || isGenerating) return;
            if (currentGame.messages && currentGame.messages.length > 0) {
                const lastMsg = currentGame.messages[currentGame.messages.length - 1];
                if (lastMsg.type === 'user') {
                    await callGemini(lastMsg.text);
                }
            }
        }

        async function deleteCurrentGame() {
            if (!currentGame) return;
            if (confirm(`Видалити гру "${currentGame.title}"?`)) {
                await dbDeleteGame(currentGame.id);
                currentGame = null;
                await refreshGameList();
            }
        }

        function updateGameState() {
            if (!currentGame) return;
            currentGame.location = document.getElementById('stateLocation').value;
            currentGame.timeOfDay = document.getElementById('stateTimeOfDay').value;
            currentGame.objectives = document.getElementById('stateObjectives').value;
            currentGame.memory = document.getElementById('stateMemory').value;
            currentGame.playerCharId = document.getElementById('playerCharSelect').value;
            dbSaveGame(currentGame);
        }

        function renderAll() {
            if (!currentGame) return;
            document.getElementById('gameStatePanel').style.display = 'flex';
            document.getElementById('currentGameTitle').innerText = currentGame.title;
            document.getElementById('stateLocation').value = currentGame.location || '';
            document.getElementById('stateTimeOfDay').value = currentGame.timeOfDay || 'День';
            document.getElementById('stateObjectives').value = currentGame.objectives || '';
            document.getElementById('stateMemory').value = currentGame.memory || '';

            syncTimeOfDayButton();
            renderCharacterSelectors();
            renderCharactersList();
            renderMessages();
            updateInputAvailability();
        }

        function updateInputAvailability() {
            const inputArea = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            if (currentGame && currentGame.isStarted) {
                inputArea.disabled = false;
                sendBtn.disabled = false;
            } else {
                inputArea.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function renderCharacterSelectors() {
            const playerSelect = document.getElementById('playerCharSelect');
            playerSelect.innerHTML = '';
            currentGame.characters.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                const raceStr = c.race ? `${c.race}, ` : '';
                opt.innerText = `${c.name || ''} ${c.surname || ''} (${raceStr}${c.gender || ''})`.trim();
                if (c.id === currentGame.playerCharId) opt.selected = true;
                playerSelect.appendChild(opt);
            });
            playerSelect.disabled = currentGame.isStarted;
        }

        /* Collapsible Character Cards */
        function renderCharactersList() {
            const container = document.getElementById('charactersList');
            container.innerHTML = '';

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { id: 'player', name: 'Гравець' };

            currentGame.characters.forEach(c => {

                    : `<span style="font-size:11px; opacity:0.7; margin-left:auto; margin-right:6px;">(Гравець)</span>`;

                // Sub-section for relations to other NPCs
                const otherNPCs = currentGame.characters.filter(other => other.id !== c.id && other.id !== currentGame.playerCharId);
                const otherNPCsHTML = otherNPCs.length > 0 ? `
                    <details style="margin-top:6px; padding:6px; border:1px solid var(--border-color); border-radius:6px; background:var(--input-bg);">

                            ${otherNPCs.map(other => {
                                const oRel = getRelation(c, other.id);
                                return `
                                <div class="form-group">
                                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
                                        <span>До ${other.name} ${other.surname}:</span>
                                        <span class="rel-badge ${getRelClass(oRel)}" id="rel_badge_${c.id}_${other.id}">${getRelIcon(oRel)} ${oRel}%</span>
                                    </div>
                                    <input type="range" min="0" max="100" value="${oRel}" oninput="updateCharRelation('${c.id}', '${other.id}', this.value); updateOtherRelBadgeUI('${c.id}', '${other.id}', this.value);">
                                </div>`;
                            }).join('')}
                        </div>
                    </details>

                details.innerHTML = `
                    <summary>
                        <img src="${avatarSrc}" class="char-avatar" style="width:28px; height:28px;">
                        <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.name || ''} ${c.surname || ''}</span>
                        ${summaryRel}
                        <button class="danger" style="padding:1px 6px; font-size:12px;" onclick="deleteCharacter(event, '${c.id}')">✕</button>
                    </summary>
                    <div class="char-details-body">
                        <div class="form-group">
                            <label>Ім'я</label>
                            <input type="text" value="${c.name || ''}" onchange="updateCharData('${c.id}', 'name', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Прізвище</label>
                            <input type="text" value="${c.surname || ''}" onchange="updateCharData('${c.id}', 'surname', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Раса</label>
                            <input type="text" value="${c.race || 'Людина'}" placeholder="Людина, Ельф, Дворф..." onchange="updateCharData('${c.id}', 'race', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Стать</label>
                            <select onchange="updateCharData('${c.id}', 'gender', this.value)">
                                <option value="Чоловіча" ${c.gender === 'Чоловіча' ? 'selected' : ''}>Чоловіча</option>
                                <option value="Жіноча" ${c.gender === 'Жіноча' ? 'selected' : ''}>Жіноча</option>
                                <option value="Інша" ${c.gender === 'Інша' ? 'selected' : ''}>Інша</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Вік</label>
                            <input type="number" value="${c.age || ''}" onchange="updateCharData('${c.id}', 'age', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Роль / Фах</label>
                            <input type="text" value="${c.role || ''}" onchange="updateCharData('${c.id}', 'role', this.value)">
                        </div>

                        ${!isPlayer ? `
                        <div class="form-group" style="padding:8px; border:1px solid var(--border-color); border-radius:6px; background:var(--input-bg);">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <label style="margin:0;">Відношення до вас (${playerChar.name})</label>
                                <span class="rel-badge ${getRelClass(relVal)}" id="rel_badge_${c.id}">${getRelIcon(relVal)} ${relVal}%</span>
                            </div>
                            <input type="range" min="0" max="100" value="${relVal}" style="margin-top:6px; cursor:pointer;" oninput="updateCharRelation('${c.id}', '${currentGame.playerCharId}', this.value); updateRelBadgeUI('${c.id}', this.value);">

                        <div class="form-group">
                            <label>Характер (Ключовий для ШІ)</label>
                            <textarea rows="3" placeholder="Опишіть манеру, темперамент, звички, недоліки..." onchange="updateCharData('${c.id}', 'personality', this.value)">${c.personality || ''}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Зовнішність</label>
                            <textarea rows="3" placeholder="Зріст, одяг, зброя, особливі прикмети..." onchange="updateCharData('${c.id}', 'appearance', this.value)">${c.appearance || ''}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Аватар</label>
                            <div class="row">

                                <input type="file" accept="image/*" style="display:none;" id="file_${c.id}" onchange="uploadAvatarFile('${c.id}', this)">
                                <button type="button" style="padding:4px 8px; font-size:12px;" onclick="document.getElementById('file_${c.id}').click()">📁</button>
                            </div>

        function uploadAvatarFile(charId, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => updateCharData(charId, 'avatar', e.target.result);
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addNewCharacter() {
            const id = 'char_' + Date.now();
            currentGame.characters.push({
                id: id, name: "Новий", surname: "Персонаж", race: "Людина", gender: "Чоловіча", age: 25, role: "Персонаж", personality: "Спокійний", appearance: "Звичайний", avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${id}`, relations: {}
            });
            dbSaveGame(currentGame);
            renderAll();
        }

        function updateCharData(id, key, val) {
            const c = currentGame.characters.find(char => char.id === id);
            if (c) {
                c[key] = key === 'age' ? parseInt(val) || 0 : val;
                dbSaveGame(currentGame);
                if (['name', 'surname', 'race', 'avatar'].includes(key)) {
                    renderCharacterSelectors();
                    renderMessages();
                }
            }
        }

        function deleteCharacter(e, id) {
            e.stopPropagation();
            currentGame.characters = currentGame.characters.filter(c => c.id !== id);
            dbSaveGame(currentGame);
            renderAll();
        }

        /* Helper to format full character profile for Gemini */
        function formatCharacterDetails(c, isPlayer = false) {
            let relText = "";
            if (!isPlayer && currentGame) {
                const playerChar = currentGame.characters.find(char => char.id === currentGame.playerCharId) || { name: "Гравець", id: "player" };
                const relToPlayer = getRelation(c, playerChar.id);
                const otherNPCs = currentGame.characters.filter(other => other.id !== c.id && other.id !== playerChar.id);
                const otherRels = otherNPCs.map(other => `    • До ${other.name} (ID: "${other.id}"): ${getRelation(c, other.id)}/100 (${getRelDescription(getRelation(c, other.id))})`).join('\n');
                
                relText = `\n  - ВІДНОШЕННЯ (0-100%):
    • До гравця ${playerChar.name} (ID: "${playerChar.id}"): ${relToPlayer}/100 [${getRelDescription(relToPlayer)}]${otherRels ? '\n' + otherRels : ''}`;
            }

            return `• ${isPlayer ? '[ГРАВЕЦЬ] ' : ''}ID: "${c.id}"
  - Ім'я: ${c.name || ''} ${c.surname || ''}
  - Раса: ${c.race || 'Людина'}
  - Стать: ${c.gender || 'Невідома'}
  - Вік: ${c.age || 'Невідомий'}
  - Роль / фах: ${c.role || 'Невідомо'}
  - ХАРАКТЕР (НАЙВИЩИЙ ПРІОРИТЕТ): ${c.personality || 'Звичайний'}
  - Зовнішність та спорядження: ${c.appearance || 'Звичайна'}${relText}`;
        }

        /* Helper to format recent conversation history */
        function formatRecentHistory(maxMessages = 10) {
            if (!currentGame || !currentGame.messages || currentGame.messages.length === 0) return "Історія поки що порожня.";
            const slice = currentGame.messages.slice(-maxMessages);
            return slice.map(m => {
                if (m.type === 'user') {
                    const p = currentGame.characters.find(c => c.id === currentGame.playerCharId);
                    const name = p ? `${p.name} ${p.surname}` : 'Гравець';
                    return `[${name}]: ${m.text}`;
                } else if (m.type === 'narration') {
                    return `[Оповідач]: ${m.text}`;
                } else if (m.type === 'character') {
                    const c = currentGame.characters.find(char => char.id === m.charId);
                    const name = c ? `${c.name} ${c.surname}` : (m.charName || 'Персонаж');
                    return `[${name}]: ${m.text}`;
                }
                return m.text;
            }).join('\n');
        }

        /* Message Rendering & Editing Last User Message in Input */
        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            if (!currentGame) return;

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Ти", surname: "", avatar: "" };
            const playerAvatar = playerChar.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=player`;

            // Find index of last user message
            let lastUserIdx = -1;
            for (let i = currentGame.messages.length - 1; i >= 0; i--) {
                if (currentGame.messages[i].type === 'user') {
                    lastUserIdx = i;
                    break;
                }
            }

            currentGame.messages.forEach((m, idx) => {
                const div = document.createElement('div');

                if (m.type === 'user') {
                    div.className = 'message user';
                    const isLastUser = (idx === lastUserIdx);
                    div.innerHTML = `
                        <div class="char-header user-header">
                            ${isLastUser ? `<button class="btn-edit-msg" onclick="editLastUserMessage(${idx})" title="Редагувати в полі вводу">✏️</button>` : ''}
                            <span class="char-name">${playerChar.name || ''} ${playerChar.surname || ''}</span>
                            <img src="${playerAvatar}" class="char-avatar" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback';">
                        </div>
                        <div class="char-text">${m.text}</div>
                    `;
                } else if (m.type === 'narration') {
                    div.className = 'message narration';
                    div.innerHTML = `<div>${m.text}</div>`;
                } else if (m.type === 'character') {
                    div.className = 'message character';
                    const char = currentGame.characters.find(c => c.id === m.charId) || { name: m.charName || "Персонаж", surname: "", avatar: "", id: m.charId || 'default' };
                    const avatarSrc = char.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${char.id}`;
                    const isPlayer = char.id === currentGame.playerCharId;
                    const relToPlayer = getRelation(char, currentGame.playerCharId);
                    const relBadge = !isPlayer
                        ? `<span class="rel-badge ${getRelClass(relToPlayer)}" title="Відношення до вас: ${relToPlayer}% (${getRelDescription(relToPlayer)})">${getRelIcon(relToPlayer)} ${relToPlayer}%</span>`
                        : '';

                    div.innerHTML = `
                        <div class="char-header">
                            <img src="${avatarSrc}" class="char-avatar" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback';">
                            <span class="char-name">${char.name || ''} ${char.surname || ''}</span>
                            ${relBadge}
                        </div>
                        <div class="char-text">${m.text}</div>
                    `;
                }
                container.appendChild(div);
            });

            // Action Buttons after AI Response
            if (currentGame.isStarted && currentGame.messages.length > 0) {
                const lastMsg = currentGame.messages[currentGame.messages.length - 1];
                if (lastMsg.type === 'narration' || lastMsg.type === 'character') {
                    const actionBar = document.createElement('div');
                    actionBar.className = 'ai-action-bar';
                    actionBar.innerHTML = `
                        <button class="ai-action-btn" onclick="triggerContinue()">⏩ Продовжити</button>
                        <button class="ai-action-btn" onclick="triggerOptions()">💡 Варіанти</button>
                    `;
                    container.appendChild(actionBar);

                    if (currentOptions.length > 0) {
                        const optionsBox = document.createElement('div');
                        optionsBox.className = 'options-list';
                        currentOptions.forEach(opt => {
                            const pill = document.createElement('div');
                            pill.className = 'option-pill';
                            pill.innerText = opt;
                            pill.onclick = () => selectOption(opt);
                            optionsBox.appendChild(pill);
                        });
                        container.appendChild(optionsBox);
                    }
                }
            }

            if (!currentGame.isStarted) {
                const startBtnDiv = document.createElement('div');
                startBtnDiv.style.display = 'flex';
                startBtnDiv.style.justifyContent = 'center';
                startBtnDiv.style.margin = '20px 0';

                const startBtn = document.createElement('button');
                startBtn.innerText = '▶ Почати гру';
                startBtn.style.padding = '12px 24px';
                startBtn.style.fontSize = '16px';
                startBtn.onclick = handleStartGameButton;

                startBtnDiv.appendChild(startBtn);
                container.appendChild(startBtnDiv);
            }

            container.scrollTop = container.scrollHeight;
        }

        /* Edit last user message directly inside the input box */
        async function editLastUserMessage(index) {
            if (!currentGame || !currentGame.messages[index]) return;
            const oldText = currentGame.messages[index].text;

            // Remove this message and subsequent messages
            currentGame.messages = currentGame.messages.slice(0, index);
            await dbSaveGame(currentGame);
            renderMessages();

            // Put into input field and focus
            const inputArea = document.getElementById('userInput');
            inputArea.value = oldText;
            inputArea.style.height = 'auto';
            inputArea.style.height = Math.min(inputArea.scrollHeight, 200) + 'px';
            inputArea.focus();
        }

        /* ==========================================
           6. GEMINI API & GAME LOGIC
           ========================================== */
        async function handleStartGameButton() {
            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;

            if (!apiKey) return alert("Вкажіть Gemini API Key у боковій панелі!");
            if (!currentGame) return;

            setStatus(true, "Генерація старту пригоди...");
            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || currentGame.characters[0];
            const otherCharacters = currentGame.characters.filter(c => c.id !== playerChar.id);

            const systemPrompt = `
Ти — майстер інтерактивного рольового квесту.
НАЗВА КВЕСТУ: ${currentGame.title}
ПОТОЧНА ЛОКАЦІЯ: ${currentGame.location}
ПОТОЧНИЙ ЧАС ДОБИ: ${currentGame.timeOfDay} (Обов'язково відповідай цьому часу доби!)
ЦІЛІ КВЕСТУ: ${currentGame.objectives}
ПАМ'ЯТЬ КВЕСТУ: ${currentGame.memory}

ПЕРСОНАЖІ:
${formatCharacterDetails(playerChar, true)}

${otherCharacters.map(c => formatCharacterDetails(c, false)).join('\n\n')}

ПРАВИЛА:
1. ХАРАКТЕРИ ПЕРСОНАЖІВ — НАЙВИЩИЙ ПРІОРИТЕТ. Поведінка, реакції та мова повинні суворо відповідати їхнім характерам (наприклад: гордість, сарказм, йогоїзм, імпульсивність мають чітко проявлятися).
2. ЧАС ДОБИ: Дій згідно з поточним часом доби.
3. ВІДНОШЕННЯ (0-100%): Враховуй поточний рівень симпатії/довіри між персонажами.
4. Згенеруй стартову сцену, що занурює гравця в атмосферу та створює початковий виклик.

Поверни JSON:
{
  "messages": [{ "type": "narration", "text": "Опис початкової ситуації..." }],
  "updatedMemory": "Оновлена пам'ять або null",
  "updatedObjectives": "Оновлені цілі або null",
  "updatedRelations": null,
  "newLocation": null,
  "newTimeOfDay": null
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: systemPrompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                currentGame.isStarted = true;
                currentGame.messages = [];

                if (result.messages && Array.isArray(result.messages)) {
                    result.messages.forEach(msg => {
                        if (msg.type === 'narration') currentGame.messages.push({ type: 'narration', text: msg.text });
                        else if (msg.type === 'character') {
                            const char = currentGame.characters.find(c => c.id === msg.charId) || currentGame.characters[0];
                            currentGame.messages.push({ type: 'character', charId: char.id, text: msg.text });
                        }
                    });
                }
                if (result.updatedMemory) currentGame.memory = result.updatedMemory;
                if (result.updatedObjectives) currentGame.objectives = result.updatedObjectives;
                if (result.newLocation && result.newLocation.trim()) currentGame.location = result.newLocation.trim();
                if (result.newTimeOfDay && TIME_STEPS.includes(result.newTimeOfDay)) currentGame.timeOfDay = result.newTimeOfDay;

                await dbSaveGame(currentGame);
                renderAll();
            } catch (err) {
                alert(`Помилка: ${err.message}`);
            } finally {
                setStatus(false);
            }
        }

        async function callGemini(text) {
            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;

            if (!apiKey) return alert("Вкажіть Gemini API Key!");
            if (!currentGame) return;

            currentOptions = []; // Reset options
            setStatus(true, "Gemini створює відповідь...");
            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Гравець", surname: "", id: "player" };
            const otherCharacters = currentGame.characters.filter(c => c.id !== currentGame.playerCharId);

            const systemPrompt = `
Ти — провідний майстер інтерактивного рольового квесту. Проаналізуй дію гравця, зміни в оточенні та дай детальну художню відповідь.

ПОТОЧНИЙ СТАН СВІТУ:
- Назва: ${currentGame.title}
- Локація: ${currentGame.location}
- Час доби: ${currentGame.timeOfDay} (СУВОРО ДОТРИМУЙСЯ! Якщо зазначено "Ніч", персонажі не можуть говорити про денне світло, якщо тільки час доби не змінюється на ранок).
- Цілі квесту: ${currentGame.objectives || 'Немає'}
- Пам'ять квесту: ${currentGame.memory || 'Немає'}

ГРАВЕЦЬ:
${formatCharacterDetails(playerChar, true)}

ПРИСУТНІ ПЕРСОНАЖІ:
${otherCharacters.length > 0 ? otherCharacters.map(c => formatCharacterDetails(c, false)).join('\n\n') : 'Немає'}

КРИТИЧНО ВАЖЛИВІ ПРАВИЛА:
1. ХАРАКТЕР ПЕРСОНАЖІВ — НАЙВИЩИЙ ПРІОРИТЕТ. Кожен персонаж ОБОВ'ЯЗКОВО поводиться, мислить та говорить відповідно до свого прописаного характеру (темперамент, гострота на язик, гордість, егоїзм, підозрілість, пристрасті). Заборонено робити гордих або підступних персонажів надмірно люб'язними чи покірними лише через просту дію або посмішку гравця!
2. ВІДНОШЕННЯ (0-100%): Відношення персонажів до гравця та один до одного змінюється динамічно відповідно до їхніх характерів, вчинків та слів:
   - Горді/егоїстичні/підозрілі персонажі підвищують відношення ДУЖЕ повільно й вимогливо (лише за реальну допомогу, повагу чи вигоду), але можуть швидко знизити його через зневагу, фальш чи образу.
   - Якщо внаслідок цієї сцени/діалогу відношення персонажа до гравця чи іншого персонажа змінилося, ОБОВ'ЯЗКОВО поверни об'єкт "updatedRelations".
     Формат: { "ID_персонажа_джерела": { "ID_цілі": нове_число_від_0_до_100 } }
     Наприклад: { "${otherCharacters[0] ? otherCharacters[0].id : 'char_id'}": { "${playerChar.id}": 42 } }
     Якщо відношення не змінилися, поверни null.
3. ЧАС ДОБИ: Якщо час доби змінюється через тривалі дії або очікування, поверни "newTimeOfDay" ("Ранок", "День", "Вечір" або "Ніч"). Якщо час не змінився, поверни null.
4. ЛОКАЦІЯ ТА ПОДОРОЖ: Якщо гравець або персонажі переміщуються, йдуть в інше місце чи подорожують, обов'язково опиши подорож та поверни нову назву локації у полі "newLocation". Якщо локація не змінилася, поверни null.
5. ПАМ'ЯТЬ ТА ЦІЛІ: Якщо трапилася важлива подія, запиши короткий факт у "newMemoryEntry". Якщо оновилися цілі, вкажи їх у "updatedObjectives".

ОСТАННІЙ КОНТЕКСТ ДІАЛОГУ ТА ПОДІЙ:
${formatRecentHistory(8)}

ОСТАННЯ ДІЯ АБО СЛОВА ГРАВЦЯ (${playerChar.name}):
"${text}"

ПОВЕРНИ ВІДПОВІДЬ ВИКЛЮЧНО У ФОРМАТІ JSON:
{
  "messages": [
    { "type": "narration", "text": "Художній опис подій, наслідків дій та оточення..." },
    { "type": "character", "charId": "ID персонажа з переліку вище", "charName": "Ім'я", "text": "Пряма мова персонажа, суворо витримана в його унікальному характері..." }
  ],
  "updatedRelations": { "ID_персонажа": { "ID_цілі": 55 } } або null,
  "newLocation": "Нова назва локації, якщо відбулося переміщення (наприклад: 'Тропа через Темний Ліс') або null",
  "newTimeOfDay": "Ранок або День або Вечір або Ніч (якщо час доби змінився) або null",
  "newMemoryEntry": "Короткий новий факт для пам'яті (або null)",
  "updatedObjectives": "Оновлені цілі або null"
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: systemPrompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                if (result.messages && Array.isArray(result.messages)) {
                    result.messages.forEach(msg => {
                        if (msg.type === 'narration') {
                            currentGame.messages.push({ type: 'narration', text: msg.text });
                        } else if (msg.type === 'character') {
                            let targetChar = currentGame.characters.find(c => c.id === msg.charId);
                            if (!targetChar && msg.charName) {
                                targetChar = currentGame.characters.find(c => (c.name + ' ' + c.surname).toLowerCase().includes(msg.charName.toLowerCase()));
                            }
                            if (!targetChar) {
                                const newId = 'char_' + Date.now();
                                targetChar = {
                                    id: newId, name: msg.charName || "Незнайомець", surname: "", race: "Людина", gender: "Інша", age: 30, role: "Незнайомець", personality: "", appearance: "", avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${newId}`, relations: {}
                                };
                                currentGame.characters.push(targetChar);
                            }
                            currentGame.messages.push({ type: 'character', charId: targetChar.id, text: msg.text });
                        }
                    });
                }

                // Dynamic updates to relationships (0-100%)
                if (result.updatedRelations && typeof result.updatedRelations === 'object') {
                    for (const [sourceId, targetMap] of Object.entries(result.updatedRelations)) {
                        const char = currentGame.characters.find(c => c.id === sourceId || (c.name && sourceId.includes(c.name)));
                        if (char) {
                            if (typeof targetMap === 'number') {
                                setRelation(char, currentGame.playerCharId, targetMap);
                            } else if (typeof targetMap === 'object' && targetMap !== null) {
                                for (const [targetId, val] of Object.entries(targetMap)) {
                                    let realTarget = currentGame.characters.find(c => c.id === targetId || (c.name && targetId.includes(c.name)));
                                    const targetKey = realTarget ? realTarget.id : (targetId === 'player' || targetId === 'Гравець' ? currentGame.playerCharId : targetId);
                                    setRelation(char, targetKey, val);
                                }
                            }
                        }
                    }
                }

                if (result.newLocation && typeof result.newLocation === 'string' && result.newLocation.trim() && result.newLocation.trim() !== currentGame.location) {
                    currentGame.location = result.newLocation.trim();
                }

                if (result.newTimeOfDay && TIME_STEPS.includes(result.newTimeOfDay)) {
                    currentGame.timeOfDay = result.newTimeOfDay;
                }

                if (result.updatedObjectives && typeof result.updatedObjectives === 'string' && result.updatedObjectives.trim()) {
                    currentGame.objectives = result.updatedObjectives.trim();
                }

                if (result.newMemoryEntry && typeof result.newMemoryEntry === 'string' && result.newMemoryEntry.trim()) {
                    currentGame.memory = (currentGame.memory ? currentGame.memory + "\n• " : "• ") + result.newMemoryEntry.trim();
                }

                await dbSaveGame(currentGame);
                renderAll();
            } catch (err) {
                alert(`Помилка: ${err.message}`);
            } finally {
                setStatus(false);
            }
        }

        async function sendMessage() {
            const inputArea = document.getElementById('userInput');
            const text = inputArea.value.trim();
            if (!text || !currentGame || !currentGame.isStarted || isGenerating) return;

            currentOptions = [];
            currentGame.messages.push({ type: 'user', text: text });
            inputArea.value = '';
            inputArea.style.height = 'auto';
            renderMessages();
            await dbSaveGame(currentGame);

            await callGemini(text);
        }

        /* Action Buttons: Continue, Options */
        async function triggerContinue() {
            if (isGenerating) return;
            currentOptions = [];
            await callGemini("Продовжуй події далі...");
        }

        async function triggerOptions() {
            if (isGenerating) return;

            if (currentOptions.length > 0) {
                currentOptions = [];
                renderMessages();
                return;
            }

            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;
            if (!apiKey) return alert("Вкажіть API Key!");

            setStatus(true, "Генерація 5 варіантів дій...");

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Гравець", personality: "" };
            const promptText = `На основі поточної ситуації в грі (Локація: ${currentGame.location}, Час доби: ${currentGame.timeOfDay}, Пам'ять: ${currentGame.memory}) запропонуй рівно 5 різних можливих варіантів дій або реплік для мого персонажа ${playerChar.name} (${playerChar.personality || 'звичайний'}). 
Останній контекст:
${formatRecentHistory(5)}

Поверни JSON: { "options": ["варіант 1", "варіант 2", "варіант 3", "варіант 4", "варіант 5"] }`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    if (result.options) currentOptions = result.options;
                }
            } catch (e) {
                console.error(e);
            } finally {
                setStatus(false);
                renderMessages();
            }
        }

        function selectOption(optText) {
            userInput.value = optText;
            currentOptions = [];
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
            userInput.focus();
            renderMessages();
        }

        /* Global Init */
        window.onload = async () => {
            initTheme();
            loadApiKey();
            loadSelectedModel();
            await initDB();
            await refreshGameList();
        };
    </script>
</body>

</html>
