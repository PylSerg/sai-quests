<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Text Quest Manager</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #7257fa;
            --accent-hover: #5d42e2;
            --text-color: #e2e2e8;
            --text-dim: #a0a0b0;
            --border-color: #2e2e38;
            --user-msg-bg: #2a2a36;
            --ai-msg-bg: #181820;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
            position: relative;
        }

        /* Sidebar - Game State & Settings */
        #sidebar {
            width: 380px;
            height: 100%;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease, transform 0.3s ease;
            z-index: 100;
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            margin-left: -380px;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Main Chat Area */
        #main-chat {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            min-width: 0;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            height: 60px;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .chat-header h2 {
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        .chat-input-area {
            padding: 12px 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        /* Mobile Overlay */
        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 90;
        }

        /* UI Components */
        input,
        select,
        textarea,
        button {
            background: #282832;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            background: var(--accent-color);
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.danger {
            background: #d93838;
        }

        button.danger:hover {
            background: #b82525;
        }

        .btn-toggle-sidebar {
            padding: 6px 12px;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: bold;
        }

        .card {
            background: #252530;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        /* Animated Loading Spinner Icon */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
            flex-shrink: 0;
        }

        .spinner.active {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Chat Message Styles */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 90%;
            line-height: 1.5;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 18px;
        }

        .message.user {
            background: var(--user-msg-bg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .message.narration {
            background: var(--ai-msg-bg);
            border-left: 3px solid var(--accent-color);
            align-self: flex-start;
            width: 100%;
            font-style: italic;
            color: #d0d0e0;
        }

        .message.character {
            background: var(--ai-msg-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .char-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .user-header {
            justify-content: flex-end;
        }

        .char-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
            border: 2px solid var(--accent-color);
        }

        .char-name {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 16px;
        }

        .message.user .char-name {
            color: var(--text-color);
        }

        .char-text {
            white-space: pre-wrap;
        }

        .btn-send {
            width: 44px !important;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            align-self: flex-end;
        }

        .btn-send svg {
            margin-left: 3px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row>select {
            flex: 1;
            min-width: 0;
            text-overflow: ellipsis;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                width: 85%;
                max-width: 340px;
                transform: translateX(-100%);
                margin-left: 0 !important;
                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #sidebar-overlay.active {
                display: block;
            }

            .chat-header {
                padding: 10px 12px;
            }

            .chat-messages {
                padding: 12px;
                gap: 10px;
            }

            .message {
                max-width: 92%;
            }

            .chat-input-area {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- OVERLAY FOR MOBILE -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR: Controls & Game State -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="form-group">
                <label>Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="Введи свій API Key..." oninput="saveApiKey(this.value)">
            </div>

            <div class="form-group">
                <label>Модель Gemini</label>
                <select id="modelSelect" onchange="saveSelectedModel(this.value)">
                    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                </select>
            </div>

            <div class="row">
                <select id="gameSelect" onchange="loadSelectedGame()"></select>
                <button onclick="createNewGame()">+ Нова</button>
                <button class="danger" onclick="deleteCurrentGame()">🗑</button>
            </div>
        </div>

        <div class="sidebar-content" id="gameStatePanel" style="display: none;">
            <!-- World Settings -->
            <div class="card">
                <div class="card-header">🌍 Оточення та Світ</div>
                <div class="form-group">
                    <label>Локація</label>
                    <input type="text" id="stateLocation" onchange="updateGameState()">
                </div>
                <div class="form-group">
                    <label>Час доби</label>
                    <select id="stateTimeOfDay" onchange="updateGameState()">
                        <option value="Ранок">🌅 Ранок</option>
                        <option value="День">☀️ День</option>
                        <option value="Вечір">🌆 Вечір</option>
                        <option value="Ніч">🌙 Ніч</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Поточні цілі квесту</label>
                    <textarea id="stateObjectives" rows="2" onchange="updateGameState()"></textarea>
                </div>
            </div>

            <!-- Character Selection -->
            <div class="card">
                <div class="card-header">🎭 Ролі у сцені</div>
                <div class="form-group">
                    <label>Твій персонаж (Гравець)</label>
                    <select id="playerCharSelect" onchange="updateGameState()"></select>
                </div>
            </div>

            <!-- Memory Log -->
            <div class="card">
                <div class="card-header">🧠 Пам'ять квесту</div>
                <textarea id="stateMemory" rows="4" placeholder="Основні моменти..."
                    onchange="updateGameState()"></textarea>
            </div>

            <!-- Characters Manager -->
            <div class="card">
                <div class="card-header">
                    👥 Персонажі
                    <button style="padding: 2px 8px;" onclick="addNewCharacter()">+</button>
                </div>
                <div id="charactersList" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div id="main-chat">
        <div class="chat-header">
            <div class="chat-header-title">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Сховати/показати меню">☰</button>
                <h2 id="currentGameTitle">Оберіть або створіть гру</h2>
            </div>
            <div id="statusSpinner" class="spinner" title="Gemini генерує відповідь..."></div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <textarea id="userInput" rows="1" style="flex: 1; resize: none; overflow-y: auto;"
                placeholder="Що ти робиш або кажеш?..." disabled></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="Надіслати" disabled>
                <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        /* ==========================================
           0. SCENARIOS PRESETS FALLBACK
           ========================================== */
        const SCENARIOS_PRESETS = [
            {
                title: "Таємниця закинутої таверни",
                location: "Запорошена загартована таверна «Чорний Круг»",
                timeOfDay: "Ніч",
                objectives: "Знайти зашифровану карту до старої шахти",
                memory: "Ви сховалися у закинутій будівлі під час грози.",
                pName: "Сергій", pSurname: "Мандрівник", pGender: "Чоловіча", pAge: 29, pPersonality: "Сміливий, допитливий", pApp: "Темний плащ, шпага на поясі", pSeed: "Serhii",
                cName: "Емілі", cSurname: "Золота Лисиця", cGender: "Жіноча", cAge: 24, cPersonality: "Хитра, спостережлива", cApp: "Шкіряний обладунок, короткий клинок", cSeed: "Emily"
            },
            {
                title: "Космічна станція «Оріон-9»",
                location: "Командний місток дрейфуючого дослідницького судна",
                timeOfDay: "Ніч",
                objectives: "Відновити подачу кисню та запустити реактор",
                memory: "Корабель вийшов з гіперпростору через невідомий збій.",
                pName: "Алекс", pSurname: "Рейнер", pGender: "Чоловіча", pAge: 35, pPersonality: "Холоднокровний, інженер", pApp: "Тактичний скафандр, сліди кіптяви", pSeed: "Alex",
                cName: "Валерія", cSurname: "Векс", cGender: "Жіноча", cAge: 27, cPersonality: "Рішуча, пілот", cApp: "Льотна куртка, планшет у руках", cSeed: "Valeria"
            }
        ];

        /* ==========================================
           1. SIDEBAR & TEXTAREA RESIZE SYSTEM
           ========================================== */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        const userInput = document.getElementById('userInput');
        let isCollapsedByOutsideClick = false;

        userInput.addEventListener('input', () => {
            if (!isCollapsedByOutsideClick && !userInput.disabled) {
                adjustTextareaHeight();
            }
        });

        userInput.addEventListener('click', () => {
            if (isCollapsedByOutsideClick && !userInput.disabled) {
                isCollapsedByOutsideClick = false;
                adjustTextareaHeight();
            }
        });

        document.addEventListener('click', (e) => {
            const inputArea = document.querySelector('.chat-input-area');
            if (inputArea && !inputArea.contains(e.target)) {
                isCollapsedByOutsideClick = true;
                userInput.style.height = '38px';
            }
        });

        function adjustTextareaHeight() {
            userInput.style.height = 'auto';
            const maxHeight = window.innerHeight * 0.8;
            userInput.style.height = Math.min(userInput.scrollHeight, maxHeight) + 'px';
        }

        /* ==========================================
           2. API KEY, MODEL & INDEXEDDB SYSTEM
           ========================================== */
        const DB_NAME = 'GeminiQuestDB';
        const DB_VERSION = 1;
        let db = null;
        let currentGame = null;

        function saveApiKey(key) {
            localStorage.setItem('gemini_api_key', key);
        }

        function loadApiKey() {
            const saved = localStorage.getItem('gemini_api_key');
            if (saved) {
                document.getElementById('apiKey').value = saved;
            }
        }

        function saveSelectedModel(model) {
            localStorage.setItem('gemini_selected_model', model);
        }

        function loadSelectedModel() {
            const saved = localStorage.getItem('gemini_selected_model') || 'gemini-2.5-flash';
            document.getElementById('modelSelect').value = saved;
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('games')) {
                        db.createObjectStore('games', { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAllGames() {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readonly');
                const store = tx.objectStore('games');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
            });
        }

        function dbSaveGame(game) {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readwrite');
                const store = tx.objectStore('games');
                const req = store.put(game);
                req.onsuccess = () => resolve(req.result);
            });
        }

        function dbDeleteGame(id) {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readwrite');
                const store = tx.objectStore('games');
                const req = store.delete(id);
                req.onsuccess = () => resolve();
            });
        }

        /* ==========================================
           3. GAME MANAGEMENT & DYNAMIC GENERATION
           ========================================== */
        async function refreshGameList() {
            const games = await dbGetAllGames();
            const select = document.getElementById('gameSelect');
            select.innerHTML = '';

            if (games.length === 0) {
                select.innerHTML = '<option value="">Немає збережених ігор</option>';
                document.getElementById('gameStatePanel').style.display = 'none';
                document.getElementById('currentGameTitle').innerText = 'Створіть нову гру';
                currentGame = null;
                renderMessages();
                return;
            }

            games.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.title;
                select.appendChild(opt);
            });

            if (!currentGame && games.length > 0) {
                select.value = games[0].id;
                await loadSelectedGame();
            } else if (currentGame) {
                select.value = currentGame.id;
            }
        }

        async function createNewGame() {
            const defaultPreset = SCENARIOS_PRESETS[Math.floor(Math.random() * SCENARIOS_PRESETS.length)];
            const title = prompt("Введіть назву нової пригоди:", defaultPreset.title);
            if (!title) return;

            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;
            const spinner = document.getElementById('statusSpinner');

            let gameData = null;

            if (apiKey) {
                spinner.classList.add('active');
                try {
                    const promptGen = `Створи стартові дані та рівно ДВА головних персонажі (обов'язково один чоловічий та один жіночий) для текстового рольового квесту, який базується на назві: "${title}". Поверни СТРОГО JSON об'єкт з наступними полями:
                    {
                      "location": "опис стартової локації відповідно до назви",
                      "timeOfDay": "Ранок або День або Вечір або Ніч",
                      "objectives": "головна мета квесту на початку",
                      "memory": "початкова пам'ять або короткий опис світу",
                      "maleCharacter": {
                        "name": "Ім'я",
                        "surname": "Прізвище",
                        "age": 28,
                        "personality": "характер",
                        "appearance": "зовнішність",
                        "seed": "seed_male"
                      },
                      "femaleCharacter": {
                        "name": "Ім'я",
                        "surname": "Прізвище",
                        "age": 26,
                        "personality": "характер",
                        "appearance": "зовнішність",
                        "seed": "seed_female"
                      }
                    }`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: promptGen }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        gameData = JSON.parse(data.candidates[0].content.parts[0].text);
                    }
                } catch (err) {
                    console.error("AI generation error, using preset fallback", err);
                } finally {
                    spinner.classList.remove('active');
                }
            }

            if (!gameData) {
                const preset = SCENARIOS_PRESETS.find(p => p.title.toLowerCase().includes(title.toLowerCase())) || defaultPreset;
                gameData = {
                    location: preset.location,
                    timeOfDay: preset.timeOfDay,
                    objectives: preset.objectives,
                    memory: preset.memory,
                    maleCharacter: { name: preset.pName, surname: preset.pSurname, age: preset.pAge, personality: preset.pPersonality, appearance: preset.pApp, seed: preset.pSeed },
                    femaleCharacter: { name: preset.cName, surname: preset.cSurname, age: preset.cAge, personality: preset.cPersonality, appearance: preset.cApp, seed: preset.cSeed }
                };
            }

            const pId = "player_" + Date.now();
            const cId = "char_" + (Date.now() + 1);

            const newGame = {
                title: title,
                location: gameData.location,
                timeOfDay: gameData.timeOfDay,
                objectives: gameData.objectives,
                memory: gameData.memory,
                playerCharId: pId,
                isStarted: false,
                characters: [
                    {
                        id: pId,
                        name: gameData.maleCharacter.name,
                        surname: gameData.maleCharacter.surname,
                        gender: "Чоловіча",
                        age: gameData.maleCharacter.age,
                        personality: gameData.maleCharacter.personality,
                        appearance: gameData.maleCharacter.appearance,
                        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${gameData.maleCharacter.seed || pId}`
                    },
                    {
                        id: cId,
                        name: gameData.femaleCharacter.name,
                        surname: gameData.femaleCharacter.surname,
                        gender: "Жіноча",
                        age: gameData.femaleCharacter.age,
                        personality: gameData.femaleCharacter.personality,
                        appearance: gameData.femaleCharacter.appearance,
                        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${gameData.femaleCharacter.seed || cId}`
                    }
                ],
                messages: [
                    { type: "narration", text: `Світ створено. Персонажі готові: ${gameData.maleCharacter.name} та ${gameData.femaleCharacter.name}. Натисніть кнопку нижче, щоб розпочати пригоду.` }
                ]
            };

            const id = await dbSaveGame(newGame);
            currentGame = { ...newGame, id };
            await refreshGameList();
            renderAll();
        }

        async function loadSelectedGame() {
            const id = parseInt(document.getElementById('gameSelect').value);
            if (!id) return;
            const games = await dbGetAllGames();
            currentGame = games.find(g => g.id === id);
            renderAll();
        }

        async function deleteCurrentGame() {
            if (!currentGame) return;
            if (confirm(`Видалити гру "${currentGame.title}"?`)) {
                await dbDeleteGame(currentGame.id);
                currentGame = null;
                await refreshGameList();
            }
        }

        function updateGameState() {
            if (!currentGame) return;
            currentGame.location = document.getElementById('stateLocation').value;
            currentGame.timeOfDay = document.getElementById('stateTimeOfDay').value;
            currentGame.objectives = document.getElementById('stateObjectives').value;
            currentGame.memory = document.getElementById('stateMemory').value;
            currentGame.playerCharId = document.getElementById('playerCharSelect').value;

            dbSaveGame(currentGame);
        }

        function renderAll() {
            if (!currentGame) return;
            document.getElementById('gameStatePanel').style.display = 'flex';
            document.getElementById('currentGameTitle').innerText = currentGame.title;

            document.getElementById('stateLocation').value = currentGame.location || '';
            document.getElementById('stateTimeOfDay').value = currentGame.timeOfDay || 'День';
            document.getElementById('stateObjectives').value = currentGame.objectives || '';
            document.getElementById('stateMemory').value = currentGame.memory || '';

            renderCharacterSelectors();
            renderCharactersList();
            renderMessages();
            updateInputAvailability();
        }

        function updateInputAvailability() {
            const inputArea = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            if (currentGame && currentGame.isStarted) {
                inputArea.disabled = false;
                inputArea.placeholder = "Що ти робиш або кажеш?...";
                sendBtn.disabled = false;
            } else {
                inputArea.disabled = true;
                inputArea.placeholder = "Натисніть «Почати» для старту гри...";
                sendBtn.disabled = true;
            }
        }

        function renderCharacterSelectors() {
            const playerSelect = document.getElementById('playerCharSelect');
            playerSelect.innerHTML = '';

            currentGame.characters.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = `${c.name || ''} ${c.surname || ''} (${c.gender || ''})`.trim();
                if (c.id === currentGame.playerCharId) opt.selected = true;
                playerSelect.appendChild(opt);
            });

            // Вибір персонажа доступний лише до того, як натиснуто кнопку "Почати"
            playerSelect.disabled = currentGame.isStarted;
        }

        function renderCharactersList() {
            const container = document.getElementById('charactersList');
            container.innerHTML = '';

            currentGame.characters.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card';
                const avatarSrc = c.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${c.id}`;

                card.innerHTML = `
            <div style="display:flex; gap:10px; align-items:center;">
                <img src="${avatarSrc}" class="char-avatar" style="width:40px; height:40px;" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback'">
                <strong style="flex:1;">${c.name || ''} ${c.surname || ''}</strong>
                <button class="danger" style="padding:2px 8px;" onclick="deleteCharacter('${c.id}')">✕</button>
            </div>

            <div class="form-group">
                <label>Ім'я</label>
                <input type="text" placeholder="Ім'я" value="${c.name || ''}" onchange="updateCharData('${c.id}', 'name', this.value)">
            </div>

            <div class="form-group">
                <label>Прізвище</label>
                <input type="text" placeholder="Прізвище" value="${c.surname || ''}" onchange="updateCharData('${c.id}', 'surname', this.value)">
            </div>

            <div class="form-group">
                <label>Стать</label>
                <select onchange="updateCharData('${c.id}', 'gender', this.value)">
                    <option value="Чоловіча" ${c.gender === 'Чоловіча' ? 'selected' : ''}>Чоловіча</option>
                    <option value="Жіноча" ${c.gender === 'Жіноча' ? 'selected' : ''}>Жіноча</option>
                    <option value="Інша" ${c.gender === 'Інша' ? 'selected' : ''}>Інша</option>
                </select>
            </div>

            <div class="form-group">
                <label>Вік</label>
                <input type="number" placeholder="Вік" value="${c.age || ''}" onchange="updateCharData('${c.id}', 'age', this.value)">
            </div>

            <input type="text" placeholder="Характер" value="${c.personality || ''}" onchange="updateCharData('${c.id}', 'personality', this.value)">
            <input type="text" placeholder="Зовнішність" value="${c.appearance || ''}" onchange="updateCharData('${c.id}', 'appearance', this.value)">
            
            <div class="form-group">
                <label>Аватарка (URL або файл)</label>
                <div class="row">
                    <input type="text" placeholder="URL зображення" value="${c.avatar && !c.avatar.startsWith('data:') ? c.avatar : ''}" onchange="updateCharData('${c.id}', 'avatar', this.value)">
                    <input type="file" accept="image/*" style="display:none;" id="file_${c.id}" onchange="uploadAvatarFile('${c.id}', this)">
                    <button type="button" style="padding:4px 8px; font-size:12px;" onclick="document.getElementById('file_${c.id}').click()">📁 Файл</button>
                </div>
            </div>
        `;
                container.appendChild(card);
            });
        }

        function uploadAvatarFile(charId, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    updateCharData(charId, 'avatar', e.target.result);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addNewCharacter() {
            const id = 'char_' + Date.now();
            currentGame.characters.push({
                id: id,
                name: "Новий",
                surname: "Персонаж",
                gender: "Чоловіча",
                age: 25,
                personality: "Спокійний",
                appearance: "Звичайний вигляд",
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${id}`
            });
            dbSaveGame(currentGame);
            renderAll();
        }

        function updateCharData(id, key, val) {
            const c = currentGame.characters.find(char => char.id === id);
            if (c) {
                c[key] = key === 'age' ? parseInt(val) || 0 : val;
                dbSaveGame(currentGame);

                if (['name', 'surname', 'avatar', 'gender'].includes(key)) {
                    renderCharacterSelectors();
                    renderMessages();
                    renderCharactersList();
                }
            }
        }

        function deleteCharacter(id) {
            currentGame.characters = currentGame.characters.filter(c => c.id !== id);
            dbSaveGame(currentGame);
            renderAll();
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            if (!currentGame) return;

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Ти", surname: "", avatar: "" };
            const playerAvatar = playerChar.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=player`;

            currentGame.messages.forEach(m => {
                const div = document.createElement('div');

                if (m.type === 'user') {
                    div.className = 'message user';
                    div.innerHTML = `
                <div class="char-header user-header">
                    <span class="char-name">${playerChar.name || ''} ${playerChar.surname || ''}</span>
                    <img src="${playerAvatar}" class="char-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback'">
                </div>
                <div class="char-text">${m.text}</div>
            `;
                } else if (m.type === 'narration') {
                    div.className = 'message narration';
                    div.innerText = m.text;
                } else if (m.type === 'character') {
                    div.className = 'message character';
                    const char = currentGame.characters.find(c => c.id === m.charId) || { name: m.charName || "Персонаж", surname: "", avatar: "" };
                    const avatarSrc = char.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${m.charId || 'default'}`;

                    div.innerHTML = `
                <div class="char-header">
                    <img src="${avatarSrc}" class="char-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback'">
                    <span class="char-name">${char.name || ''} ${char.surname || ''}</span>
                </div>
                <div class="char-text">${m.text}</div>
            `;
                }
                container.appendChild(div);
            });

            // Якщо гра ще не почалася, додаємо кнопку "Почати" в кінець повідомлень
            if (!currentGame.isStarted) {
                const startBtnDiv = document.createElement('div');
                startBtnDiv.style.display = 'flex';
                startBtnDiv.style.justifyContent = 'center';
                startBtnDiv.style.margin = '20px 0';

                const startBtn = document.createElement('button');
                startBtn.innerText = '▶ Почати гру';
                startBtn.style.padding = '12px 24px';
                startBtn.style.fontSize = '16px';
                startBtn.onclick = handleStartGameButton;

                startBtnDiv.appendChild(startBtn);
                container.appendChild(startBtnDiv);
            }

            container.scrollTop = container.scrollHeight;
        }

        /* ==========================================
           4. GEMINI API INTEGRATION & GAME ENGINE
           ========================================== */
        async function handleStartGameButton() {
            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;
            const spinner = document.getElementById('statusSpinner');

            if (!apiKey) return alert("Будь ласка, вкажи Gemini API Key у боковій панелі!");
            if (!currentGame) return;

            spinner.classList.add('active');
            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || currentGame.characters[0];

            const systemPrompt = `
Ти — майстер текстового рольового квесту. Гра щойно створена. 
Передивись поточний стан світу та персонажів. ЗАБОРОНЕНО змінювати або видаляти персонажів, але ти можеш перевірити та за потреби трохи підкоригувати історію, пам'ять або цілі квесту, щоб усе ідеально узгоджувалося перед стартом.

НАЗВА ГРИ: ${currentGame.title}
- Локація: ${currentGame.location}
- Час доби: ${currentGame.timeOfDay}
- Поточні цілі: ${currentGame.objectives}
- Пам'ять квесту: ${currentGame.memory}

ПЕРСОНАЖІ:
${currentGame.characters.map(c => `- ID: "${c.id}", Ім'я: ${c.name} ${c.surname}, Стать: ${c.gender}, Вік: ${c.age}, Характер: ${c.personality}`).join('\n')}
Обраний гравець грає за: ${playerChar.name} ${playerChar.surname} (${playerChar.gender})

Згенеруй стартове повідомлення гри (атмосферний вступ, опис стартової ситуації).
Поверни відповідь СТРОГО у форматованому JSON з наступною структурою:
{
  "messages": [
    { "type": "narration", "text": "Стартовий атмосферний опис подій..." }
  ],
  "updatedMemory": "Оновлена та скоригована пам'ять квесту або опис",
  "updatedObjectives": "Оновлені цілі квесту (або поточні)"
}
`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: systemPrompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                currentGame.isStarted = true;
                currentGame.messages = []; // очищуємо старе проміжне повідомлення

                if (result.messages && Array.isArray(result.messages)) {
                    result.messages.forEach(msg => {
                        if (msg.type === 'narration') {
                            currentGame.messages.push({ type: 'narration', text: msg.text });
                        }
                    });
                } else {
                    currentGame.messages.push({ type: 'narration', text: "Пригода розпочинається..." });
                }

                if (result.updatedMemory) currentGame.memory = result.updatedMemory;
                if (result.updatedObjectives) currentGame.objectives = result.updatedObjectives;

                await dbSaveGame(currentGame);
                renderAll();

            } catch (err) {
                console.error(err);
                alert(`Помилка API: ${err.message}`);
            } finally {
                spinner.classList.remove('active');
            }
        }

        async function callGemini(text) {
            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;
            const spinner = document.getElementById('statusSpinner');

            if (!apiKey) return alert("Будь ласка, вкажи Gemini API Key у боковій панелі!");
            if (!currentGame) return;

            spinner.classList.add('active');

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Гравець", surname: "" };

            const systemPrompt = `
Ти — майстер текстового рольового квесту. Проаналізуй стан гри та дію гравця. Створи живу, динамічну історію.

НАЗВА ГРИ: ${currentGame.title}
- Локація: ${currentGame.location}
- Час доби: ${currentGame.timeOfDay}
- Поточні цілі: ${currentGame.objectives}
- Пам'ять квесту: ${currentGame.memory}

ГРАВЕЦЬ:
- Гравець грає за: ${playerChar.name} ${playerChar.surname} (Стать: ${playerChar.gender || 'не вказано'}, Вік: ${playerChar.age || 'не вказано'}, Характер: ${playerChar.personality}, Зовнішність: ${playerChar.appearance})

ПЕРСОНАЖІ У СВІТІ:
${currentGame.characters.filter(c => c.id !== currentGame.playerCharId).map(c => `- ID: "${c.id}", Ім'я: ${c.name} ${c.surname}, Стать: ${c.gender || 'не вказано'}, Вік: ${c.age || 'не вказано'}, Характер: ${c.personality}`).join('\n')}

ПРАВИЛА ТА ФОРМАТ:
1. Повідомлення з описом (narration) та репліками персонажів (character) можуть довільно перемішуватися у хронологічному порядку в масиві "messages" для повної імерсивності.
2. Якщо в історії згадується або з'являється новий персонаж, якого немає в списку вище, ти можеш додати його в масив повідомлень із зазначенням його повного імені у "charName" (і ШІ автоматично додасть його до списку).
3. Повертай відповідь СТРОГО у форматованому JSON з наступною структурою:
{
  "messages": [
    { "type": "narration", "text": "Опис подій, атмосфери чи дій довкола" },
    { "type": "character", "charId": "ID_існуючого_або_порожньо", "charName": "Ім'я персонажа (якщо новий або уточнення)", "text": "Пряма мова персонажа" }
  ],
  "newMemoryEntry": "Теза для доповнення пам'яті квесту (або null)"
}
`;

            const payload = {
                contents: [
                    { role: "user", parts: [{ text: systemPrompt + "\n\nДІЯ ГРАВЦЯ: " + text }] }
                ],
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text;
                const result = JSON.parse(jsonText);

                if (result.messages && Array.isArray(result.messages)) {
                    result.messages.forEach(msg => {
                        if (msg.type === 'narration') {
                            currentGame.messages.push({ type: 'narration', text: msg.text });
                        } else if (msg.type === 'character') {
                            let targetChar = currentGame.characters.find(c => c.id === msg.charId);
                            if (!targetChar && msg.charName) {
                                targetChar = currentGame.characters.find(c => (c.name + ' ' + c.surname).toLowerCase().includes(msg.charName.toLowerCase()));
                            }
                            if (!targetChar) {
                                const newId = 'char_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                                const nameParts = (msg.charName || "Незнайомець").split(' ');
                                targetChar = {
                                    id: newId,
                                    name: nameParts[0] || "Незнайомець",
                                    surname: nameParts.slice(1).join(' ') || "",
                                    gender: "Інша",
                                    age: 30,
                                    personality: "Загадковий",
                                    appearance: "Відповідно до ситуації",
                                    avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${newId}`
                                };
                                currentGame.characters.push(targetChar);
                            }
                            currentGame.messages.push({
                                type: 'character',
                                charId: targetChar.id,
                                text: msg.text
                            });
                        }
                    });
                }

                if (result.newMemoryEntry) {
                    currentGame.memory = (currentGame.memory ? currentGame.memory + "\n• " : "• ") + result.newMemoryEntry;
                }

                await dbSaveGame(currentGame);
                renderAll();

            } catch (err) {
                console.error(err);
                alert(`Помилка API: ${err.message}`);
            } finally {
                statusSpinner.classList.remove('active');
            }
        }

        async function sendMessage() {
            const inputArea = document.getElementById('userInput');
            const text = inputArea.value.trim();

            if (!text || !currentGame || !currentGame.isStarted) return;

            currentGame.messages.push({ type: 'user', text: text });
            inputArea.value = '';
            inputArea.style.height = '38px';
            renderMessages();
            await dbSaveGame(currentGame);

            await callGemini(text);
        }

        // Global App Init
        window.onload = async () => {
            loadApiKey();
            loadSelectedModel();
            await initDB();
            await refreshGameList();
        };
    </script>
</body>

</html>
