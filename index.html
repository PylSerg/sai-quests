<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAI Quests</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #7257fa;
            --accent-hover: #5d42e2;
            --text-color: #e2e2e8;
            --text-dim: #a0a0b0;
            --border-color: #2e2e38;
            --user-msg-bg: #2a2a36;
            --ai-msg-bg: #181820;
            --card-bg: #252530;
            --input-bg: #282832;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f8;
            --panel-bg: #ffffff;
            --accent-color: #6246ea;
            --accent-hover: #4c35c3;
            --text-color: #2b2c34;
            --text-dim: #6c757d;
            --border-color: #dcdce6;
            --user-msg-bg: #e8e6f8;
            --ai-msg-bg: #ffffff;
            --card-bg: #f8f9fa;
            --input-bg: #f0f0f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--panel-bg);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--panel-bg);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
            transition: background 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            display: flex;
            position: relative;
        }

        /* Sidebar */
        #sidebar {
            width: 380px;
            height: 100%;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease, transform 0.3s ease;
            z-index: 100;
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            margin-left: -380px;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Main Chat Area */
        #main-chat {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            min-width: 0;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            height: 60px;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .chat-header h2 {
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-round {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            padding: 0;
            cursor: pointer;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-round:hover {
            border-color: var(--accent-color);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        /* Generation Status & Spinner Bar */
        #statusContainer {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--accent-color);
            font-weight: 500;
        }

        #statusContainer.active {
            display: flex;
        }

        .pulse-loader {
            display: flex;
            gap: 6px;
        }

        .pulse-loader span {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .pulse-loader span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .pulse-loader span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }

            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: 12px 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-controls {
            display: flex;
            gap: 10px;
        }

        /* Action Buttons & Options Container */
        .ai-action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .ai-action-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-weight: normal;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 16px;
        }

        .ai-action-btn:hover {
            border-color: var(--accent-color);
            background: var(--panel-bg);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
        }

        .option-pill {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .option-pill:hover {
            border-color: var(--accent-color);
            transform: translateX(3px);
        }

        /* Mobile Overlay */
        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 90;
        }

        /* Form Inputs */
        input,
        select,
        textarea,
        button {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            background: var(--accent-color);
            cursor: pointer;
            border: none;
            font-weight: bold;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.danger {
            background: #d93838;
        }

        button.danger:hover {
            background: #b82525;
        }

        .btn-toggle-sidebar {
            padding: 6px 12px;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        /* Collapsible Character Cards */
        details.char-details {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            background: var(--panel-bg);
        }

        details.char-details summary {
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            list-style: none;
        }

        details.char-details summary::-webkit-details-marker {
            display: none;
        }

        .char-details-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        /* Message Styling */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 90%;
            line-height: 1.5;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 17px;
            position: relative;
        }

        .message.user {
            background: var(--user-msg-bg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .message.narration {
            background: var(--ai-msg-bg);
            border-left: 3px solid var(--accent-color);
            align-self: flex-start;
            width: 100%;
            font-style: italic;
            color: var(--text-color);
        }

        .message.character {
            background: var(--ai-msg-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .char-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .user-header {
            justify-content: flex-end;
        }

        .char-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
            border: 2px solid var(--accent-color);
        }

        .char-name {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 15px;
        }

        .message.user .char-name {
            color: var(--text-color);
        }

        .char-text {
            white-space: pre-wrap;
        }

        .btn-edit-msg {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 2px 5px;
        }

        .btn-edit-msg:hover {
            opacity: 1;
        }

        .btn-send {
            width: 44px !important;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            align-self: flex-end;
        }

        .btn-send svg {
            margin-left: 3px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row>select {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                width: 85%;
                max-width: 340px;
                transform: translateX(-100%);
                margin-left: 0 !important;
                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #sidebar-overlay.active {
                display: block;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="row" style="justify-content: space-between;">
                <strong>Gemini Quest</strong>
                <button class="btn-round" onclick="toggleTheme()" id="themeToggleBtn"
                    title="Переключити тему">☀️</button>
            </div>

            <div class="form-group">
                <label>Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="Введи свій API Key..." oninput="saveApiKey(this.value)">
            </div>

            <div class="form-group">
                <label>Модель Gemini</label>
                <select id="modelSelect" onchange="saveSelectedModel(this.value)">
                    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                    <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                </select>
            </div>

            <div class="row">
                <select id="gameSelect" onchange="loadSelectedGame()"></select>
                <button onclick="createNewGame()" title="Створити гру">+</button>
                <button onclick="exportCurrentGame()" title="Експорт у JSON">📤</button>
                <button onclick="document.getElementById('importFileInput').click()" title="Імпорт з JSON">📥</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importGame(this)">
                <button class="danger" onclick="deleteCurrentGame()" title="Видалити гру">🗑</button>
            </div>
        </div>

        <div class="sidebar-content" id="gameStatePanel" style="display: none;">
            <!-- World Settings -->
            <div class="card">
                <div class="card-header">🌍 Оточення та Світ</div>
                <div class="form-group">
                    <label>Локація</label>
                    <textarea rows="2" id="stateLocation" onchange="updateGameState()"></textarea>
                </div>
                <div class="form-group">
                    <label>Час доби</label>
                    <select id="stateTimeOfDay" onchange="updateGameState(); syncTimeOfDayButton();">
                        <option value="Ранок">🌅 Ранок</option>
                        <option value="День">☀️ День</option>
                        <option value="Вечір">🌆 Вечір</option>
                        <option value="Ніч">🌙 Ніч</option>
                    </select>
                </div>
            </div>

            <!-- Objectives -->
            <div class="card">
                <div class="card-header">🎯 Цілі квесту</div>
                <textarea id="stateObjectives" rows="4" onchange="updateGameState()"></textarea>
            </div>

            <!-- Memory Log -->
            <div class="card">
                <div class="card-header">🧠 Пам'ять квесту</div>
                <textarea id="stateMemory" rows="4" placeholder="Основні моменти..."
                    onchange="updateGameState()"></textarea>
            </div>

            <!-- Character Selection -->
            <div class="card">
                <div class="card-header">🎭 Ваш гравець</div>
                <select id="playerCharSelect" onchange="updateGameState()"></select>
            </div>

            <!-- Characters Manager -->
            <div class="card">
                <div class="card-header">
                    👥 Персонажі
                    <button style="padding: 2px 8px;" onclick="addNewCharacter()">+</button>
                </div>
                <div id="charactersList" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div id="main-chat">
        <div class="chat-header">
            <div class="chat-header-title">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Меню">☰</button>
                <h2 id="currentGameTitle">Оберіть або створіть гру</h2>
            </div>
            <div class="header-actions">
                <button class="btn-round" id="headerTimeBtn" onclick="cycleTimeOfDay()"
                    title="Змінити час доби">☀️</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <!-- GENERATION SPINNER (Relocated above input) -->
        <div id="statusContainer">
            <div class="pulse-loader">
                <span></span><span></span><span></span>
            </div>
            <span id="statusText">Gemini створює відповідь...</span>
        </div>

        <div class="chat-input-area">
            <div class="input-controls">
                <textarea id="userInput" rows="1" style="flex: 1; resize: none; overflow-y: auto;"
                    placeholder="Що ти робиш або кажеш?..." disabled></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="Надіслати" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================
           0. PRESETS & INITIALIZATION
           ========================================== */
        const SCENARIOS_PRESETS = [
            {
                title: "Таємниця закинутої таверни",
                location: "Запорошена таверна «Чорний Круг»",
                timeOfDay: "Ніч",
                objectives: "Знайти зашифровану карту до старої шахти",
                memory: "Ви сховалися у закинутій будівлі під час грози.",
                pName: "Сергій", pSurname: "Мандрівник", pGender: "Чоловіча", pAge: 29, pRole: "Шукач пригод", pPersonality: "Сміливий, допитливий", pApp: "Темний плащ, шпага на поясі", pSeed: "Serhii",
                cName: "Емілі", cSurname: "Золота Лисиця", cGender: "Жіноча", cAge: 24, cRole: "Здібна злодійка", cPersonality: "Хитра, спостережлива", cApp: "Шкіряний обладунок, короткий клинок", cSeed: "Emily"
            }
        ];

        const TIME_STEPS = ["Ранок", "День", "Вечір", "Ніч"];
        const TIME_ICONS = { "Ранок": "🌅", "День": "☀️", "Вечір": "🌆", "Ніч": "🌙" };

        let db = null;
        let currentGame = null;
        let isGenerating = false;
        let currentOptions = [];

        /* ==========================================
           1. THEME & UI HELPERS
           ========================================== */
        function initTheme() {
            const saved = localStorage.getItem('app_theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
            updateThemeButtonText();
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('app_theme', next);
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const current = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerText = current === 'light' ? '🌙' : '☀️';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        function cycleTimeOfDay() {
            if (!currentGame) return;
            const currentIdx = TIME_STEPS.indexOf(currentGame.timeOfDay || "День");
            const nextIdx = (currentIdx + 1) % TIME_STEPS.length;
            currentGame.timeOfDay = TIME_STEPS[nextIdx];
            document.getElementById('stateTimeOfDay').value = currentGame.timeOfDay;
            syncTimeOfDayButton();
            dbSaveGame(currentGame);
        }

        function syncTimeOfDayButton() {
            const tod = currentGame ? currentGame.timeOfDay : "День";
            document.getElementById('headerTimeBtn').innerText = TIME_ICONS[tod] || "☀️";
        }

        function setStatus(loading, text = "Gemini генерує відповідь...") {
            isGenerating = loading;
            const container = document.getElementById('statusContainer');
            const statusText = document.getElementById('statusText');
            if (loading) {
                statusText.innerText = text;
                container.classList.add('active');
            } else {
                container.classList.remove('active');
            }
        }

        /* Auto Textarea Height */
        const userInput = document.getElementById('userInput');
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        });

        /* ==========================================
           2. STORAGE & DATABASE (IndexedDB)
           ========================================== */
        const DB_NAME = 'GeminiQuestDB';
        const DB_VERSION = 1;

        function saveApiKey(key) { localStorage.setItem('gemini_api_key', key); }
        function loadApiKey() {
            const saved = localStorage.getItem('gemini_api_key');
            if (saved) document.getElementById('apiKey').value = saved;
        }

        function saveSelectedModel(model) { localStorage.setItem('gemini_selected_model', model); }
        function loadSelectedModel() {
            const saved = localStorage.getItem('gemini_selected_model') || 'gemini-2.5-flash';
            document.getElementById('modelSelect').value = saved;
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('games')) {
                        db.createObjectStore('games', { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAllGames() {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readonly');
                const store = tx.objectStore('games');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
            });
        }

        function dbSaveGame(game) {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readwrite');
                const store = tx.objectStore('games');
                const req = store.put(game);
                req.onsuccess = () => resolve(req.result);
            });
        }

        function dbDeleteGame(id) {
            return new Promise((resolve) => {
                const tx = db.transaction('games', 'readwrite');
                const store = tx.objectStore('games');
                const req = store.delete(id);
                req.onsuccess = () => resolve();
            });
        }

        /* ==========================================
           3. IMPORT / EXPORT JSON
           ========================================== */
        function exportCurrentGame() {
            if (!currentGame) return alert("Немає активної гри для експорту!");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentGame, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${currentGame.title || 'game'}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importGame(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedGame = JSON.parse(e.target.result);
                    delete importedGame.id; // Assign new ID
                    const id = await dbSaveGame(importedGame);
                    currentGame = { ...importedGame, id };
                    await refreshGameList();
                    renderAll();
                    alert("Гру успішно імпортовано!");
                } catch (err) {
                    alert("Помилка читання JSON файлу: " + err.message);
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        /* ==========================================
           4. GAME STATE ENGINE
           ========================================== */
        async function refreshGameList() {
            const games = await dbGetAllGames();
            const select = document.getElementById('gameSelect');
            select.innerHTML = '';

            if (games.length === 0) {
                select.innerHTML = '<option value="">Немає збережених ігор</option>';
                document.getElementById('gameStatePanel').style.display = 'none';
                document.getElementById('currentGameTitle').innerText = 'Створіть нову гру';
                currentGame = null;
                renderMessages();
                return;
            }

            games.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.title;
                select.appendChild(opt);
            });

            if (!currentGame && games.length > 0) {
                select.value = games[0].id;
                await loadSelectedGame();
            } else if (currentGame) {
                select.value = currentGame.id;
            }
        }

        async function createNewGame() {
            const defaultPreset = SCENARIOS_PRESETS[0];
            const title = prompt("Введіть назву нової пригоди:", defaultPreset.title);
            if (!title) return;

            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;

            let gameData = null;

            if (apiKey) {
                setStatus(true, "Створення світу та персонажів...");
                try {
                    const promptGen = `Створи початковий світ та 2 головних персонажів для квесту: "${title}". Поверни JSON з полями:
                    {
                      "location": "опис локації", "timeOfDay": "Ранок або День або Вечір або Ніч", "objectives": "цілі", "memory": "пам'ять",
                      "maleCharacter": { "name": "", "surname": "", "age": 25, "role": "", "personality": "", "appearance": "", "seed": "m1" },
                      "femaleCharacter": { "name": "", "surname": "", "age": 24, "role": "", "personality": "", "appearance": "", "seed": "f1" }
                    }`;

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: promptGen }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        gameData = JSON.parse(data.candidates[0].content.parts[0].text);
                    }
                } catch (err) {
                    console.error("AI error, using fallback preset", err);
                } finally {
                    setStatus(false);
                }
            }

            if (!gameData) {
                gameData = {
                    location: defaultPreset.location,
                    timeOfDay: defaultPreset.timeOfDay,
                    objectives: defaultPreset.objectives,
                    memory: defaultPreset.memory,
                    maleCharacter: { name: defaultPreset.pName, surname: defaultPreset.pSurname, age: defaultPreset.pAge, role: defaultPreset.pRole, personality: defaultPreset.pPersonality, appearance: defaultPreset.pApp, seed: defaultPreset.pSeed },
                    femaleCharacter: { name: defaultPreset.cName, surname: defaultPreset.cSurname, age: defaultPreset.cAge, role: defaultPreset.cRole, personality: defaultPreset.cPersonality, appearance: defaultPreset.cApp, seed: defaultPreset.cSeed }
                };
            }

            const pId = "player_" + Date.now();
            const cId = "char_" + (Date.now() + 1);

            const newGame = {
                title: title,
                location: gameData.location,
                timeOfDay: gameData.timeOfDay,
                objectives: gameData.objectives,
                memory: gameData.memory,
                playerCharId: pId,
                isStarted: false,
                characters: [
                    {
                        id: pId, name: gameData.maleCharacter.name, surname: gameData.maleCharacter.surname, gender: "Чоловіча", age: gameData.maleCharacter.age, role: gameData.maleCharacter.role, personality: gameData.maleCharacter.personality, appearance: gameData.maleCharacter.appearance, avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${gameData.maleCharacter.seed}`
                    },
                    {
                        id: cId, name: gameData.femaleCharacter.name, surname: gameData.femaleCharacter.surname, gender: "Жіноча", age: gameData.femaleCharacter.age, role: gameData.femaleCharacter.role, personality: gameData.femaleCharacter.personality, appearance: gameData.femaleCharacter.appearance, avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${gameData.femaleCharacter.seed}`
                    }
                ],
                messages: [
                    { type: "narration", text: `Світ створено. Персонажі: ${gameData.maleCharacter.name} та ${gameData.femaleCharacter.name}. Натисніть «Почати гру».` }
                ]
            };

            const id = await dbSaveGame(newGame);
            currentGame = { ...newGame, id };
            await refreshGameList();
            renderAll();
        }

        async function loadSelectedGame() {
            const id = parseInt(document.getElementById('gameSelect').value);
            if (!id) return;
            const games = await dbGetAllGames();
            currentGame = games.find(g => g.id === id);
            renderAll();
        }

        async function deleteCurrentGame() {
            if (!currentGame) return;
            if (confirm(`Видалити гру "${currentGame.title}"?`)) {
                await dbDeleteGame(currentGame.id);
                currentGame = null;
                await refreshGameList();
            }
        }

        function updateGameState() {
            if (!currentGame) return;
            currentGame.location = document.getElementById('stateLocation').value;
            currentGame.timeOfDay = document.getElementById('stateTimeOfDay').value;
            currentGame.objectives = document.getElementById('stateObjectives').value;
            currentGame.memory = document.getElementById('stateMemory').value;
            currentGame.playerCharId = document.getElementById('playerCharSelect').value;
            dbSaveGame(currentGame);
        }

        function renderAll() {
            if (!currentGame) return;
            document.getElementById('gameStatePanel').style.display = 'flex';
            document.getElementById('currentGameTitle').innerText = currentGame.title;
            document.getElementById('stateLocation').value = currentGame.location || '';
            document.getElementById('stateTimeOfDay').value = currentGame.timeOfDay || 'День';
            document.getElementById('stateObjectives').value = currentGame.objectives || '';
            document.getElementById('stateMemory').value = currentGame.memory || '';

            syncTimeOfDayButton();
            renderCharacterSelectors();
            renderCharactersList();
            renderMessages();
            updateInputAvailability();
        }

        function updateInputAvailability() {
            const inputArea = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            if (currentGame && currentGame.isStarted) {
                inputArea.disabled = false;
                sendBtn.disabled = false;
            } else {
                inputArea.disabled = true;
                sendBtn.disabled = true;
            }
        }

            const playerSelect = document.getElementById('playerCharSelect');
            playerSelect.innerHTML = '';
            currentGame.characters.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = `${c.name || ''} ${c.surname || ''} (${c.gender || ''})`.trim();
                if (c.id === currentGame.playerCharId) opt.selected = true;
                playerSelect.appendChild(opt);
            });
            playerSelect.disabled = currentGame.isStarted;
        }

        function uploadAvatarFile(charId, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => updateCharData(charId, 'avatar', e.target.result);
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addNewCharacter() {
            const id = 'char_' + Date.now();
            currentGame.characters.push({
                id: id, name: "Новий", surname: "Персонаж", gender: "Чоловіча", age: 25, role: "Персонаж", personality: "Спокійний", appearance: "Звичайний", avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${id}`
            });
            dbSaveGame(currentGame);
            renderAll();
        }

        function updateCharData(id, key, val) {
            const c = currentGame.characters.find(char => char.id === id);
            if (c) {
                c[key] = key === 'age' ? parseInt(val) || 0 : val;
                dbSaveGame(currentGame);
                if (['name', 'surname', 'avatar'].includes(key)) {
                    renderCharacterSelectors();
                    renderMessages();
                }
            }
        }

        function deleteCharacter(e, id) {
            e.stopPropagation();
            currentGame.characters = currentGame.characters.filter(c => c.id !== id);
            dbSaveGame(currentGame);
            renderAll();
        }

        /* Message Rendering & Editing Last User Message */
        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            if (!currentGame) return;

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Ти", surname: "", avatar: "" };
            const playerAvatar = playerChar.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=player`;

            // Find index of last user message
            let lastUserIdx = -1;
            for (let i = currentGame.messages.length - 1; i >= 0; i--) {
                if (currentGame.messages[i].type === 'user') {
                    lastUserIdx = i;
                    break;
                }
            }

            currentGame.messages.forEach((m, idx) => {
                const div = document.createElement('div');

                if (m.type === 'user') {
                    div.className = 'message user';
                    const isLastUser = (idx === lastUserIdx);
                    div.innerHTML = `
                        <div class="char-header user-header">
                            ${isLastUser ? `<button class="btn-edit-msg" onclick="editLastUserMessage(${idx})" title="Редагувати">✏️</button>` : ''}
                            <span class="char-name">${playerChar.name || ''} ${playerChar.surname || ''}</span>
                            <img src="${playerAvatar}" class="char-avatar" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback';">
                        </div>
                        <div class="char-text">${m.text}</div>
                    `;
                } else if (m.type === 'narration') {
                    div.className = 'message narration';
                    div.innerHTML = `<div>${m.text}</div>`;
                } else if (m.type === 'character') {
                    div.className = 'message character';
                    const char = currentGame.characters.find(c => c.id === m.charId) || { name: m.charName || "Персонаж", surname: "", avatar: "" };
                    const avatarSrc = char.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${m.charId || 'default'}`;

                    div.innerHTML = `
                        <div class="char-header">
                            <img src="${avatarSrc}" class="char-avatar" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback';">
                            <span class="char-name">${char.name || ''} ${char.surname || ''}</span>
                        </div>
                        <div class="char-text">${m.text}</div>
                    `;
                }
                container.appendChild(div);
            });

            // Action Buttons after AI Response
            if (currentGame.isStarted && currentGame.messages.length > 0) {
                const lastMsg = currentGame.messages[currentGame.messages.length - 1];
                if (lastMsg.type === 'narration' || lastMsg.type === 'character') {
                    const actionBar = document.createElement('div');
                    actionBar.className = 'ai-action-bar';
                    actionBar.innerHTML = `
                        <button class="ai-action-btn" onclick="triggerContinue()">⏩ Продовжити</button>
                        <button class="ai-action-btn" onclick="triggerOptions()">💡 Варіанти</button>
                    `;
                    container.appendChild(actionBar);

                    if (currentOptions.length > 0) {
                        const optionsBox = document.createElement('div');
                        optionsBox.className = 'options-list';
                        currentOptions.forEach(opt => {
                            const pill = document.createElement('div');
                            pill.className = 'option-pill';
                            pill.innerText = opt;
                            pill.onclick = () => selectOption(opt);
                            optionsBox.appendChild(pill);
                        });
                        container.appendChild(optionsBox);
                    }
                }
            }

            if (!currentGame.isStarted) {
                const startBtnDiv = document.createElement('div');
                startBtnDiv.style.display = 'flex';
                startBtnDiv.style.justifyContent = 'center';
                startBtnDiv.style.margin = '20px 0';

                const startBtn = document.createElement('button');
                startBtn.innerText = '▶ Почати гру';
                startBtn.style.padding = '12px 24px';
                startBtn.style.fontSize = '16px';
                startBtn.onclick = handleStartGameButton;

                startBtnDiv.appendChild(startBtn);
                container.appendChild(startBtnDiv);
            }

            container.scrollTop = container.scrollHeight;
        }

        async function editLastUserMessage(index) {
            const oldText = currentGame.messages[index].text;
            const newText = prompt("Редагувати останнє повідомлення:", oldText);
            if (!newText || newText === oldText) return;

            // Remove all messages after this edited message
            currentGame.messages = currentGame.messages.slice(0, index);
            currentGame.messages.push({ type: 'user', text: newText });

            await dbSaveGame(currentGame);
            renderMessages();
            await callGemini(newText);
        }

        /* ==========================================
           5. GEMINI API & GAME LOGIC
           ========================================== */
        async function handleStartGameButton() {
            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;

            if (!apiKey) return alert("Вкажіть Gemini API Key у боковій панелі!");
            if (!currentGame) return;

            setStatus(true, "Генерація старту пригоди...");
            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || currentGame.characters[0];

            const systemPrompt = `
Ти — майстер текстового квесту. Згенеруй стартовий опис ситуації.
НАЗВА: ${currentGame.title} | Локація: ${currentGame.location} | Час доби: ${currentGame.timeOfDay}
Цілі: ${currentGame.objectives} | Пам'ять: ${currentGame.memory}
ПЕРСОНАЖІ:
${currentGame.characters.map(c => `- ${c.name} ${c.surname} (${c.gender}, ${c.role})`).join('\n')}
Гравець: ${playerChar.name} ${playerChar.surname}

Поверни JSON:
{
  "messages": [{ "type": "narration", "text": "Опис подій..." }],
  "updatedMemory": "Оновлена пам'ять",
  "updatedObjectives": "Оновлені цілі"
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: systemPrompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                currentGame.isStarted = true;
                currentGame.messages = [];

                if (result.messages) {
                    result.messages.forEach(msg => {
                        if (msg.type === 'narration') currentGame.messages.push({ type: 'narration', text: msg.text });
                    });
                }
                if (result.updatedMemory) currentGame.memory = result.updatedMemory;
                if (result.updatedObjectives) currentGame.objectives = result.updatedObjectives;

                await dbSaveGame(currentGame);
                renderAll();
            } catch (err) {
                alert(`Помилка: ${err.message}`);
            } finally {
                setStatus(false);
            }
        }

        async function callGemini(text) {
            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;

            if (!apiKey) return alert("Вкажіть Gemini API Key!");
            if (!currentGame) return;

            currentOptions = []; // Reset options
            setStatus(true, "Gemini створює відповідь...");
            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Гравець", surname: "" };

            const systemPrompt = `
Ти — майстер рольового квесту. Проаналізуй дію гравця і дай відповідь.
НАЗВА: ${currentGame.title} | Локація: ${currentGame.location} | Час доби: ${currentGame.timeOfDay}
Цілі: ${currentGame.objectives} | Пам'ять: ${currentGame.memory}
ГРАВЕЦЬ: ${playerChar.name} ${playerChar.surname} (${playerChar.gender})
ІНШІ ПЕРСОНАЖІ:
${currentGame.characters.filter(c => c.id !== currentGame.playerCharId).map(c => `- ID: "${c.id}", Ім'я: ${c.name} ${c.surname}`).join('\n')}

Формат JSON:
{
  "messages": [
    { "type": "narration", "text": "Опис дій" },
    { "type": "character", "charId": "ID", "charName": "Ім'я", "text": "Пряма мова" }
  ],
  "newMemoryEntry": "Новий факт або null"
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: systemPrompt + "\n\nДІЯ ГРАВЦЯ: " + text }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                if (result.messages && Array.isArray(result.messages)) {
                    result.messages.forEach(msg => {
                        if (msg.type === 'narration') {
                            currentGame.messages.push({ type: 'narration', text: msg.text });
                        } else if (msg.type === 'character') {
                            let targetChar = currentGame.characters.find(c => c.id === msg.charId);
                            if (!targetChar && msg.charName) {
                                targetChar = currentGame.characters.find(c => (c.name + ' ' + c.surname).toLowerCase().includes(msg.charName.toLowerCase()));
                            }
                            if (!targetChar) {
                                const newId = 'char_' + Date.now();
                                targetChar = {
                                    id: newId, name: msg.charName || "Незнайомець", surname: "", gender: "Інша", age: 30, role: "Незнайомець", personality: "", appearance: "", avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${newId}`
                                };
                                currentGame.characters.push(targetChar);
                            }
                            currentGame.messages.push({ type: 'character', charId: targetChar.id, text: msg.text });
                        }
                    });
                }

                if (result.newMemoryEntry) {
                    currentGame.memory = (currentGame.memory ? currentGame.memory + "\n• " : "• ") + result.newMemoryEntry;
                }

                await dbSaveGame(currentGame);
                renderAll();
            } catch (err) {
                alert(`Помилка: ${err.message}`);
            } finally {
                setStatus(false);
            }
        }

        async function sendMessage() {
            const inputArea = document.getElementById('userInput');
            const text = inputArea.value.trim();
            if (!text || !currentGame || !currentGame.isStarted || isGenerating) return;

            currentOptions = [];
            currentGame.messages.push({ type: 'user', text: text });
            inputArea.value = '';
            inputArea.style.height = 'auto';
            renderMessages();
            await dbSaveGame(currentGame);

            await callGemini(text);
        }

        /* Action Buttons: Continue, Options */
        async function triggerContinue() {
            if (isGenerating) return;
            currentOptions = [];
            await callGemini("Продовжуй події далі...");
        }

        async function triggerOptions() {
            if (isGenerating) return;

            if (currentOptions.length > 0) {
                currentOptions = [];
                renderMessages();
                return;
            }

            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;
            if (!apiKey) return alert("Вкажіть API Key!");

            setStatus(true, "Генерація 5 варіантів дій...");

            const promptText = `На основі останньої ситуації в грі запропонуй рівно 5 різних можливих варіантів дій чи реплік для мого персонажа. Поверни JSON: { "options": ["варіант 1", "варіант 2", "варіант 3", "варіант 4", "варіант 5"] }`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    if (result.options) currentOptions = result.options;
                }
            } catch (e) {
                console.error(e);
            } finally {
                setStatus(false);
                renderMessages();
            }
        }

        function selectOption(optText) {
            userInput.value = optText;
            currentOptions = [];
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
            userInput.focus();
            renderMessages();
        }

        /* Global Init */
        window.onload = async () => {
            initTheme();
            loadApiKey();
            loadSelectedModel();
            await initDB();
            await refreshGameList();
        };
    </script>
</body>

</html>
